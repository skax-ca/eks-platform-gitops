# dev 클러스터 등록 — 원격 spoke다. ArgoCD 자신이 도는 클러스터가 아니다.
#
# hub와 형태가 다르다: server가 in-cluster 내장 URL이 아니라 실제 EKS API endpoint이고,
# config에 awsAuthConfig로 크로스 계정 AssumeRole 인증 체인을 명시한다.
#
# ⚠️ server는 EKS 클러스터 ARN이 아니다 — self-managed ArgoCD의 공식 계약은
#    https://<endpoint>(API 서버 URL)다. ARN을 쓰는 계약은 AWS가 완전 관리하는
#    "EKS Capability for Argo CD"(이 프로젝트가 쓰지 않는 별개 제품) 전용이다.
#
# roleARN은 eks-reference-infra의 cross-account-trust-role 모듈이 spoke 계정에 만든
# Role이고, 신뢰 정책의 Principal이 hub의 argocd_hub_pod_identity Role이다.
#
# 라벨 계약은 README 「cluster Secret 라벨 계약」이 갖는다.
apiVersion: v1
kind: Secret
metadata:
  name: eks-demo-dev-an2-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    environment: dev
    # 어휘는 nonprd | prd 둘로 고정이다. dev는 비운영 환경이라 nonprd다.
    tier: nonprd
    region: an2
    # ALBC가 VPC를 찾는 값. ID가 아니라 Name 태그를 쓰는 이유는 AWS 발급 ID가 재구축마다
    # 바뀌는 반면 네이밍 규칙이 이 이름의 유일성을 보장하기 때문이다.
    # 확인: aws ec2 describe-vpcs --filters "Name=tag:Name,Values=vpc-demo-dev-*"
    vpcName: vpc-demo-dev-an2-main
    # Karpenter EC2NodeClass용 노드 IAM role 이름. eks-cluster 모듈이 네이밍 규칙대로 고정
    # 이름을 만들어 재구축을 견딘다.
    # 확인: aws iam list-roles --query '...RoleName'
    karpenterNodeRole: iamr-demo-dev-an2-karpenter-node
    # 카탈로그 구독. cluster-autoscaler는 Terraform 쪽 enable_cluster_autoscaler가 켜져
    # 있어야 하고(live/dev/eks/main.tf), keda는 전제가 없다.
    addon-cluster-autoscaler: enabled
    addon-keda: enabled
type: Opaque
stringData:
  name: eks-demo-dev-an2-main-01
  server: https://7007BF200A956D4C762B21B5936C0B0A.gr7.ap-northeast-2.eks.amazonaws.com
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "eks-demo-dev-an2-main-01",
        "roleARN": "arn:aws:iam::614054776208:role/iamr-demo-dev-an2-argocd-hub"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }
  project: platform
