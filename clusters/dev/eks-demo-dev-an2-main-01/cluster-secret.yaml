# dev(spoke) 클러스터 등록 — 크로스 계정 self-managed ArgoCD 등록
#
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT), 질문 D
#
# hub의 cluster-secret.yaml과 형태가 다르다 — 이 클러스터는 ArgoCD가 도는 클러스터가 아니라
# **원격 대상**이라 server가 in-cluster 내장 URL이 아니라 실제 EKS API endpoint이고, config에
# awsAuthConfig로 크로스 계정 AssumeRole 인증 체인을 명시한다.
#
# ⚠️ server는 EKS 클러스터 ARN이 아니다 — self-managed ArgoCD의 공식 계약은
#    https://<endpoint>(API 서버 URL)이다. ARN을 쓰는 계약은 AWS가 완전 관리하는
#    "EKS Capability for Argo CD"(이 프로젝트가 쓰지 않는 별개 제품) 전용이다.
#
# roleARN은 iac-reference-infra의 cross-account-trust-role 모듈이 spoke 계정에 만든
# iamr-demo-dev-an2-argocd-hub — access_entries가 이 Role에 AmazonEKSClusterAdminPolicy를
# 붙였다(iac-module-library docs/05-modules.md 「K8s 권한 부여 방식」 절 — access policy로
# 요구가 충족되면 kubernetes_groups+RBAC로 내려가지 않는다).
apiVersion: v1
kind: Secret
metadata:
  name: eks-demo-dev-an2-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # ── baseline addon ApplicationSet selector 소스 ──
    # values 경로 해석에도 쓰인다: clusters/{{metadata.labels.environment}}/{{name}}/
    # addons/baseline/*.yaml의 cluster generator는 이 키의 존재만 검사한다
    # (matchExpressions Exists) — 전 클러스터 자동 팬아웃, 값 자체는 경로 해석용이다.
    environment: dev
    tier: dev
    region: an2
    # ── per-cluster addon 파라미터 소스 (hub cluster-secret.yaml과 같은 패턴) ──
    # 실측(2026-08-20): aws ec2 describe-vpcs --filters "Name=tag:Name,Values=vpc-demo-dev-*"
    vpcName: vpc-demo-dev-an2-main
    # 실측(2026-08-20): aws iam list-roles / access entry 목록 조회로 확인.
    karpenterNodeRole: iamr-demo-dev-an2-karpenter-node
    # ── opt-in 카탈로그 구독 ──
    # dev는 managed_node_groups 오토스케일링을 쓴다 — cluster-autoscaler 구독
    # (README.md 확인, 2026-08-14 taint 분리 실측 검증 완료). keda는 미구독.
    addon-cluster-autoscaler: enabled
type: Opaque
stringData:
  name: eks-demo-dev-an2-main-01
  server: https://2E95AD97794CBB1F3433FA126412A979.yl4.ap-northeast-2.eks.amazonaws.com
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "eks-demo-dev-an2-main-01",
        "roleARN": "arn:aws:iam::614054776208:role/iamr-demo-dev-an2-argocd-hub"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }
  project: platform
