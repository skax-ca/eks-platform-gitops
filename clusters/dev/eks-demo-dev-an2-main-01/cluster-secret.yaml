# dev 클러스터 등록 (ArgoCD 자신이 도는 클러스터) — 등록의 GitOps 절반
#
# 설계: skax-ca/iac-module-library docs/design/30-gitops-repo.md §2.1 · §4.1 seed 4단계
#
# ⭐ **self-managed 에서 이 파일이 존재하는 이유는 "연결"이 아니라 "라벨과 이름"이다**(30 §4.1 정정).
#    ArgoCD 는 자신이 도는 클러스터에 ServiceAccount 로 이미 닿는다(내장 `in-cluster`).
#    그러나 내장 항목에는 **Secret 도 라벨도 없어서**:
#      - addon ApplicationSet 의 cluster generator `matchLabels` 가 매칭되지 않아 팬아웃이 안 되고
#      - `{{name}}` 이 `in-cluster` 가 되어 ALBC 의 필수 파라미터 clusterName 에 틀린 값이 들어간다
#    ⇒ 라벨과 실제 클러스터명을 주기 위해 이 Secret 을 만든다.
#
# ✅ **해소(2026-08-10)** — 이 Secret 은 내장 `in-cluster` 항목을 **대체한다. 중복이 아니다.**
#    `argocd admin cluster stats -n argocd` 결과 서버 항목이 **하나뿐**이다(README 판정 ③).
#    ⚠️ 이 주석은 2026-08-11 에 고쳤다 — 판정이 끝났는데 *"apply 후 확인할 것"* 으로 남아 있었다.
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 이름은 **실제 EKS 클러스터명**을 쓴다 — ApplicationSet cluster generator 의 {{name}} 이
  #    ALBC 의 필수 파라미터 clusterName 으로 그대로 흘러가기 때문(30 §2.2).
  #    'dev-cluster' 같은 별칭을 쓰면 그 자리에 틀린 값이 들어가고 **조용히 실패**한다.
  name: eks-demo-dev-an2-main-01
  namespace: argocd
  labels:
    # ArgoCD 가 이 Secret 을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # ── ApplicationSet matchLabels 소스 (30 §2.1) ──
    environment: dev # values 경로 해석에도 쓰인다: clusters/{{metadata.labels.environment}}/{{name}}/
    tier: nonprd # 분리 트리거·정책 스코프
    region: an2
    # ── per-cluster addon 파라미터 소스 (30 §2.1) ──
    # ALBC 는 파드에서 IMDS 로 VPC 를 자동 탐지하지 못한다 — 노드 IMDSv2 hop limit=1 이라
    # `ec2imds context deadline exceeded` 로 CrashLoop 한다(PoC 실증).
    # ⛔ hop limit 을 2로 올리는 우회는 기각됐다 — 그 노드의 모든 파드가 노드 IAM role 을
    #    탈취 가능해져 Pod Identity 격리가 클러스터 전체에서 무너진다.
    #    🔑 IMDS 를 못 쓰는 것은 결함이 아니라 **받아들이는 제약**이다. 고칠 것은 제약이 아니라
    #       그 제약을 푸는 방식이었다.
    #
    # ⭐ **ID 가 아니라 이름으로 찾는다**(2026-08-12). upstream 이 `--aws-vpc-tags` 를 이미 제공한다
    #    (chart 3.5.0 values 주석: "This is alternative to vpcId. Set this when your pods are
    #     unable to use the metadata service" — 우리 상황 그대로다).
    #    전에는 `vpcId: vpc-…` 였는데 AWS 발급 ID 라 **재구축하면 반드시 바뀐다.**
    #    실제로 2026-08-12 재구축 뒤 파기된 VPC 를 가리키고 있었다.
    #    ⚠️ 그 상태에서도 ArgoCD 는 Synced/Healthy 로 보였다 — helm 값일 뿐이라 실패가
    #       ALBC 런타임으로 밀린다. karpenterNodeRole 과 **같은 함정**이다.
    # ⇒ Name 태그는 이 자산의 네이밍 규칙(SSOT)이 유일성을 보장하므로 재구축을 견딘다.
    vpcName: vpc-demo-dev-an2-main
    # ── Karpenter EC2NodeClass 용 노드 IAM role 이름 ──
    #   나머지는 파생된다: interruptionQueue=Karpenter-{{name}} · discovery 태그 값={{name}}
    #
    # ⭐ **이 값은 더 이상 "파생 불가"가 아니다**(2026-08-12, D-KARPENTER-NODE-ROLE-NAME).
    #    예전엔 upstream 기본이 `Karpenter-<cluster>-<무작위>` 라 재구축마다 바뀌었고,
    #    실제로 from-zero 재구축 뒤 Karpenter 가 iam:PassRole 403 으로 멈췄다.
    #    이제 eks-cluster >= v0.5.0 이 네이밍 규칙대로 고정 이름을 만든다:
    #      iamr-<workload>-<env>-<region>-karpenter-node
    #    ⇒ 재구축을 해도 이 값은 그대로다. 60자 < 63자 label 한도.
    karpenterNodeRole: iamr-demo-dev-an2-karpenter-node
    # ── ②opt-in 카탈로그 구독 (30 §2.4 · §2.10.3, 2026-08-11) ──
    # ⭐ **이 라벨이 "옵트인" 그 자체다.** addons/catalog/keda.yaml 의 cluster generator 가
    #    matchLabels {addon-keda: enabled} 로 거르므로, 라벨을 빼면 그 클러스터엔 KEDA 가 뜨지 않는다.
    #    ①baseline(environment: dev 로 전 클러스터)과 갈리는 지점이 바로 여기다.
    #
    # 🔴 **30 §2.9 의 *"cluster Secret 은 손대지 않는다"* 는 baseline addon 전제였다**(§2.10.3 정정).
    #    카탈로그는 **옵트인이 곧 라벨**이므로 손댄다.
    #    🔑 O(1) 은 유지된다 — 새 클러스터도 여전히 Secret 1개이고, 라벨이 하나 늘 뿐이다.
    #
    # ⚠️ 값은 **문자열이어야 한다** — k8s 라벨 값에 boolean 은 없다. `true` 가 아니라 "enabled".
    addon-keda: "enabled"
type: Opaque
stringData:
  name: eks-demo-dev-an2-main-01
  # ⚠️ self-managed 는 클러스터 내부 워크로드라 이 URL 로 자기 apiserver 에 닿는다.
  #    관리형 Capability 는 여기에 **EKS 클러스터 ARN** 을 쓴다 — 21 §1.7 갈림점 3.
  server: https://kubernetes.default.svc
  # ⚠️ 함정 — 이 값을 지정하면 그 프로젝트에서만 destination 으로 쓸 수 있는 project-scoped
  #    cluster 가 된다. projects/platform.yaml 의 이름과 반드시 일치해야 한다. 어긋나면
  #    UI 에 클러스터가 unknown 으로 뜨는데 **증상이 원인을 가리키지 않는다**(30 §2.1).
  #    앱팀 AppProject 가 생기면 이 클러스터를 공유해야 하므로 그때 전역(빈 값)으로 완화한다.
  project: platform
