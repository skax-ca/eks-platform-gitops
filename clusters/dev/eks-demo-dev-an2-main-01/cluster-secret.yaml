# dev 클러스터 등록 — 원격 spoke다. ArgoCD 자신이 도는 클러스터가 아니다.
#
# hub와 형태가 다르다: server가 in-cluster 내장 URL이 아니라 실제 EKS API endpoint이고,
# config에 awsAuthConfig로 크로스 계정 AssumeRole 인증 체인을 명시한다.
#
# ⚠️ server는 EKS 클러스터 ARN이 아니다 — self-managed ArgoCD의 공식 계약은
#    https://<endpoint>(API 서버 URL)다. ARN을 쓰는 계약은 AWS가 완전 관리하는
#    "EKS Capability for Argo CD"(이 프로젝트가 쓰지 않는 별개 제품) 전용이다.
#
# roleARN은 eks-reference-infra의 cross-account-trust-role 모듈이 spoke 계정에 만든
# Role이고, 신뢰 정책의 Principal이 hub의 argocd_hub_pod_identity Role이다.
#
# 라벨 계약은 README 「cluster Secret 라벨 계약」이 갖는다.
apiVersion: v1
kind: Secret
metadata:
  name: eks-demo-dev-an2-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # ⛔ 철거 1단계: fan-out 매칭 라벨(environment·tier·addon-*)만 뺀다. server/config는
    #    남겨 접속 자격증명을 유지한다 — 지우면 ArgoCD가 이 클러스터에 접속할 방법을
    #    잃어 cascade delete가 완주하지 못한다. vpcName·karpenterNodeRole은 addon
    #    values라 매칭과 무관하지만 재등록 때 재입력을 피하려고 남겨 둔다.
    region: an2
    vpcName: vpc-demo-dev-an2-main
    karpenterNodeRole: iamr-demo-dev-an2-karpenter-node
type: Opaque
stringData:
  name: eks-demo-dev-an2-main-01
  server: https://1229F9C9CBC40AD94C6319CABBA4EAF2.yl4.ap-northeast-2.eks.amazonaws.com
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "eks-demo-dev-an2-main-01",
        "roleARN": "arn:aws:iam::614054776208:role/iamr-demo-dev-an2-argocd-hub"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }
  project: platform
