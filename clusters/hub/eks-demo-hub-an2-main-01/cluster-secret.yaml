# hub 클러스터 등록 — ArgoCD 자신이 도는 클러스터다.
#
# 🔑 self-managed 에서 이 파일이 있는 이유는 연결이 아니라 라벨과 이름이다. ArgoCD 는 자신이 도는
#    클러스터에 ServiceAccount 로 이미 닿지만(내장 in-cluster), 그 항목에는 Secret 도 라벨도 없어서
#    cluster generator 가 매칭하지 못하고 {{name}} 이 `in-cluster` 가 된다. 이 Secret 이 내장
#    항목을 대체한다 — 중복이 아니다.
# spoke 는 형태가 다르다. server 가 실제 EKS API endpoint 이고, config 에 awsAuthConfig.roleARN 으로
#    크로스 계정 인증 체인을 명시한다.
# 라벨 계약은 README 「cluster Secret 라벨 계약」이 갖는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/aws/
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 실제 EKS 클러스터명을 쓴다. 이 이름이 {{name}} 으로 ALBC 의 clusterName 에 흘러가므로
  #    별칭을 쓰면 조용히 실패한다.
  name: eks-demo-hub-an2-main-01
  namespace: argocd
  labels:
    # ArgoCD 가 이 Secret 을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # uniform 팬아웃은 이 키의 존재만 검사하지만, 🔑 값도 소비된다 — shared-gateway 차트가 이 값으로
    #    ALB 이름과 태그를 만들고 required 로 강제하므로 비면 helm 렌더가 실패한다.
    #    ⛔ 디렉토리 경로 해석에는 쓰이지 않는다. clusters/<env>/<cluster>/ 는 사람이 파일을 정리하는
    #       단위일 뿐이고 ApplicationSet 이 이 경로를 조립하지 않는다.
    environment: hub
    # ⚠️ 어휘는 nonprd | prd 둘로 고정이다. environment 와 달리 클러스터가 늘어도 값이 늘지 않아야
    #    staged selector 가 걸 대상을 예측할 수 있다. hub 는 control-plane 의 영구 거처라 prd 다.
    tier: prd
    region: an2
    # ALBC 가 VPC 를 찾는 값이다. ID 가 아니라 Name 태그를 쓰는 이유는 AWS 발급 ID 가 재구축마다
    #    바뀌는 반면 네이밍 규칙이 이 이름의 유일성을 보장하기 때문이다.
    #    ⚠️ 이 값이 틀려도 ArgoCD 는 Synced/Healthy 다 — helm 값이라 실패가 ALBC 런타임으로 밀린다.
    # 확인: aws ec2 describe-vpcs --filters "Name=tag:Name,Values=vpc-demo-hub-*"
    vpcName: vpc-demo-hub-an2-main
    # Karpenter EC2NodeClass 용 노드 IAM role 이름. 이 값만 클러스터명에서 파생되지 않아 라벨로
    #    받는다(나머지는 파생된다 — interruptionQueue·discovery 태그).
    #    eks-cluster 모듈이 네이밍 규칙대로 고정 이름을 만들어 재구축을 견딘다. upstream 기본값은
    #    무작위 접미가 붙어 재구축마다 바뀌고, 그러면 Karpenter 가 iam:PassRole 403 으로 멈춘다.
    # 확인: aws iam list-roles --query '...RoleName'
    karpenterNodeRole: iamr-demo-hub-an2-karpenter-node
    # 카탈로그 구독. cluster-autoscaler 는 Terraform 쪽 enable_cluster_autoscaler 가 켜져 있어야
    #    하고, keda 는 전제가 없다.
    addon-cluster-autoscaler: enabled
    addon-keda: enabled
type: Opaque
stringData:
  name: eks-demo-hub-an2-main-01
  # self-managed 는 클러스터 내부 워크로드라 이 URL 로 자기 apiserver 에 닿는다.
  server: https://kubernetes.default.svc
  # ⚠️ 이 값을 지정하면 그 프로젝트에서만 쓸 수 있는 project-scoped cluster 가 된다.
  #    projects/platform.yaml 의 이름과 어긋나면 UI 에 클러스터가 unknown 으로 뜨는데 증상이
  #    원인을 가리키지 않는다. 앱팀 AppProject 가 생기면 그때 전역(빈 값)으로 완화한다.
  project: platform
