# hub 클러스터 등록 (ArgoCD 자신이 도는 클러스터) — 등록의 GitOps 절반
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/aws/
#
# **self-managed 에서 이 파일이 존재하는 이유는 "연결"이 아니라 "라벨과 이름"이다.**
#    ArgoCD 는 자신이 도는 클러스터에 ServiceAccount 로 이미 닿는다(내장 `in-cluster`).
#    그러나 내장 항목에는 **Secret 도 라벨도 없어서**:
#      - addon ApplicationSet 의 cluster generator selector 가 매칭되지 않아 팬아웃이 안 되고
#      - `{{name}}` 이 `in-cluster` 가 되어 ALBC 의 필수 파라미터 clusterName 에 틀린 값이 들어간다
#    ⇒ 라벨과 실제 클러스터명을 주기 위해 이 Secret 을 만든다.
#
# ✅ 이 Secret 은 내장 `in-cluster` 항목을 **대체한다. 중복이 아니다.**
#    `argocd admin cluster stats -n argocd` 결과 서버 항목이 **하나뿐**임을 확인했다.
#
# 🔑 hub 는 ArgoCD control-plane 자신이 도는 클러스터다 — 크로스 계정 spoke 는 이 Secret 이
#    아니라 `iac-module-library`의 `cross-account-trust-role`(스포크 소유 신뢰 Role)을 통해
#    등록한다(spoke cluster Secret 은 `server` 가 실제 EKS API endpoint 이고 `config` 에
#    `awsAuthConfig.roleARN` 으로 크로스 계정 인증 체인을 명시한다 — 이 파일과 형태가 다르다).
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 이름은 **실제 EKS 클러스터명**을 쓴다 — ApplicationSet cluster generator 의 {{name}} 이
  #    ALBC 의 필수 파라미터 clusterName 으로 그대로 흘러가기 때문.
  #    별칭을 쓰면 그 자리에 틀린 값이 들어가고 **조용히 실패**한다.
  name: eks-demo-hub-an2-main-01
  namespace: argocd
  labels:
    # ArgoCD 가 이 Secret 을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # ── uniform 정책 selector 소스 + addon 파라미터 ──
    # uniform ApplicationSet(kyverno 3종·gateway·karpenter-nodepool)이 이 키의 **존재만**
    # 검사한다(matchExpressions Exists) — 값과 무관하게 전 클러스터 팬아웃.
    # 🔑 **값도 소비된다.** gateway.yaml 이 helm 파라미터로 넘기고 shared-gateway 차트가 그 값으로
    #    ALB 이름과 태그를 만든다: `alb-demo-<environment>-an2-shared-01` · `tags.env`.
    #    차트가 `required` 로 강제하므로 **비면 helm 렌더가 실패한다** ⇒ 값 자체가 계약이다.
    #    ⛔ 경로 해석에는 쓰이지 않는다. 디렉토리 `clusters/<env>/<cluster>/` 는 사람이 파일을
    #       정리하는 단위이고, root-app 이 재귀 스캔할 뿐 ApplicationSet 이 이 경로를 조립하지 않는다.
    environment: hub
    # ── staged 정책 selector 소스 ──
    # staged ApplicationSet(karpenter·aws-load-balancer-controller·gateway-api-crds)이 이 키의
    # **값**을 매칭한다(matchLabels). 어휘는 **nonprd | prd 둘로 고정**이다 — environment 와 달리
    # 클러스터가 늘어도 값이 늘지 않아야 selector 가 걸 대상을 예측할 수 있다.
    # hub 는 ArgoCD control-plane 의 영구 거처다(dev 처럼 재구축 대상이 아니다) ⇒ prd 로 분류한다.
    tier: prd
    region: an2
    # ── per-cluster addon 파라미터 소스 ──
    # ALBC 는 파드에서 IMDS 로 VPC 를 자동 탐지하지 못한다 — 노드 IMDSv2 hop limit=1 이라
    # `ec2imds context deadline exceeded` 로 CrashLoop 한다.
    # ⛔ hop limit 을 2로 올리는 우회는 기각됐다 — 그 노드의 모든 파드가 노드 IAM role 을
    #    탈취 가능해져 Pod Identity 격리가 클러스터 전체에서 무너진다.
    #    🔑 IMDS 를 못 쓰는 것은 결함이 아니라 **받아들이는 제약**이다. 고칠 것은 제약이 아니라
    #       그 제약을 푸는 방식이었다.
    #
    # **ID 가 아니라 이름으로 찾는다.** upstream 이 `--aws-vpc-tags` 를 이미 제공한다
    #    (chart 3.5.0 values 주석: "This is alternative to vpcId. Set this when your pods are
    #     unable to use the metadata service" — 우리 상황 그대로다).
    #    AWS 발급 ID(`vpcId: vpc-…`)를 쓰면 **재구축할 때마다 반드시 바뀐다.**
    #    ⚠️ 그 상태에서도 ArgoCD 는 Synced/Healthy 로 보였다 — helm 값일 뿐이라 실패가
    #       ALBC 런타임으로 밀린다. karpenterNodeRole 과 **같은 함정**이다.
    # ⇒ Name 태그는 이 자산의 네이밍 규칙(SSOT)이 유일성을 보장하므로 재구축을 견딘다.
    # 확인 방법: aws ec2 describe-vpcs --filters "Name=tag:Name,Values=vpc-demo-hub-*"
    vpcName: vpc-demo-hub-an2-main
    # ── Karpenter EC2NodeClass 용 노드 IAM role 이름 ──
    #   나머지는 파생된다: interruptionQueue=Karpenter-{{name}} · discovery 태그 값={{name}}
    #
    # **이 값은 클러스터명에서 파생되지 않는다.** `eks-cluster` 모듈 >= v0.5.0 이 네이밍
    #    규칙대로 고정 이름을 만든다: `iamr-<workload>-<env>-<region>-karpenter-node`.
    #    (upstream 기본값은 `Karpenter-<cluster>-<무작위>`라 재구축마다 바뀌는 이름이었다 —
    #    그 이름으로는 Karpenter가 `iam:PassRole` 403으로 멈춘다.)
    #    ⇒ 재구축을 해도 이 값은 그대로다. 60자 < 63자 label 한도.
    # 확인 방법: aws iam list-roles --query '...RoleName' 조회.
    karpenterNodeRole: iamr-demo-hub-an2-karpenter-node
    # ── ②opt-in 카탈로그 구독 ──
    # hub도 dev와 같은 managed_node_groups.system(taint workload-class=system) 구성을 쓰고
    # enable_cluster_autoscaler=true가 이미 켜져 있어 cluster-autoscaler Terraform 전제가
    # 충족돼 있다. keda는 Terraform 전제가 없다(applicationsets/catalog/keda.yaml 헤더 참조).
    addon-cluster-autoscaler: enabled
    addon-keda: enabled
type: Opaque
stringData:
  name: eks-demo-hub-an2-main-01
  # ⚠️ self-managed 는 클러스터 내부 워크로드라 이 URL 로 자기 apiserver 에 닿는다.
  #    관리형 Capability 로 전환하면 여기에 **EKS 클러스터 ARN** 을 쓴다.
  server: https://kubernetes.default.svc
  # ⚠️ 함정 — 이 값을 지정하면 그 프로젝트에서만 destination 으로 쓸 수 있는 project-scoped
  #    cluster 가 된다. projects/platform.yaml 의 이름과 반드시 일치해야 한다. 어긋나면
  #    UI 에 클러스터가 unknown 으로 뜨는데 **증상이 원인을 가리키지 않는다.**
  #    앱팀 AppProject 가 생기면 이 클러스터를 공유해야 하므로 그때 전역(빈 값)으로 완화한다.
  project: platform
