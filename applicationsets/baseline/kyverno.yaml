# Kyverno 엔진 — baseline addon. 정책은 kyverno-policies.yaml(업스트림 PSS)과
# kyverno-custom-policies.yaml(우리 소유)이 갖는다.
#
# baseline 인 이유: 옵트인 가드레일은 가드레일이 아니다.
# ⛔ 엔진과 업스트림 정책은 **같은 마이너 라인**에 둔다. 차트 번호 일치가 아니라 라인 일치다 —
#    정책 차트가 요구하는 것은 엔진 app 버전의 하한이고, 그 라인에 짝이 없는 엔진 패치(보안
#    백포트가 이 형태로 온다)는 엔진만 올린다. 승격은 nonprd 둘을 먼저, 그다음 prd 둘이다.
# ⚠️ 이미지가 reg.kyverno.io(GHCR 앞 vanity 도메인)라 노드가 reg.kyverno.io 와 ghcr.io 둘 다
#    나가야 한다. 다른 baseline addon 은 전부 public.ecr.aws 라 여기만 경로가 다르다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
---
# prd 티어 — 엔진(helm)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # 🔑 엔진은 admission webhook 컨트롤러이기도 해서, 깨지면 그 클러스터의 모든 배포가
          #    막힌다. 그래서 비운영에서 먼저 확인하고 승격한다.
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-kyverno'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # 정책보다 먼저. ⚠️ wave 는 생성 순서만 정하고 sync 완료를 기다리지 않는다 —
        #    실제 안전장치는 정책 쪽 SkipDryRunOnMissingResource 다.
        argocd.argoproj.io/sync-wave: "0"
        # 이것이 없으면 CRD 11개가 영구 OutOfSync 다. 차이 나는 `spec.conversion` 은 apiserver 가
        #    채운 무소유 필드라 managedFields 기반 ignoreDifferences 로는 잡히지 않는다.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      sources:
        - repoURL: https://kyverno.github.io/kyverno/
          chart: kyverno
          # ⛔ 3.8 라인으로 되돌리지 않는다. 이 엔진이 쓰는 정책 타입은 CEL 기반
          #    policies.kyverno.io/ValidatingPolicy 이고, legacy kyverno.io 타입(ClusterPolicy·
          #    Policy·CleanupPolicy·PolicyException)은 v1.19 에서 deprecated, v1.20 에서 제거된다.
          #    AppProject 의 whitelist 와 커스텀 정책이 이미 새 kind 라 되돌리면 셋이 함께 어긋난다.
          targetRevision: 3.9.1
          helm:
            valueFiles:
              - $values/addons/kyverno/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # ⚠️ 자동 생성된 Namespace 도 AppProject 의 clusterResourceWhitelist 검사를 받는다.
          #    ns 가 이미 있으면 검사 자체가 없어 두 번째 클러스터에서만 깨진다.
          #    ⛔ managedNamespaceMetadata 는 쓰지 않는다 — ArgoCD 가 ns 를 소유하게 되고,
          #       아래 prune: true 와 겹치면 addon 제거가 네임스페이스째 지운다.
          - CreateNamespace=true
          # CRD 22개가 커서 client-side apply 의 애노테이션 크기 한도에 걸린다.
          - ServerSideApply=true
---
# nonprd 티어 — 규약은 README 「staged 전파」. 위 블록과 함께 고치고, 갈려도 되는 값은
# targetRevision 하나다. ⚠️ 라인을 넘는 승격은 엔진과 업스트림 정책을 짝으로 움직인다(위 헤더).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-kyverno'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "0"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      sources:
        - repoURL: https://kyverno.github.io/kyverno/
          chart: kyverno
          targetRevision: 3.9.1
          helm:
            valueFiles:
              - $values/addons/kyverno/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
