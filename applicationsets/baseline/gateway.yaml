# Gateway API 실사용 계층 — baseline addon. GatewayClass·LoadBalancerConfiguration·Gateway 를 만든다.
#
# CRD 는 gateway-api-crds.yaml 이 먼저 깐다. sync-wave 5 인 이유다.
# ⛔ HTTPRoute·백엔드 Service 는 여기 없다 — 계층 3(앱 GitOps)은 이 저장소 범위 밖이다. 앱팀이
#    이 Gateway 를 parentRefs 로 참조하는 HTTPRoute 를 자기 저장소에 만든다.
# ⚠️ 이 리소스가 적용되는 순간 실제 ALB 가 생성된다(과금 시작). HTTPRoute 유무와 무관하다.
# ⚠️ ALBC 는 Gateway API CRD 존재 여부를 파드 시작 시점에만 감지하고 캐싱한다. 이미 떠 있던 ALBC 가
#    있는 클러스터에 CRD 를 나중에 깔면 GatewayClass 가 Accepted=Unknown 인 채로 조용히 멈춘다 —
#    에러가 아니다. `kubectl -n kube-system rollout restart deploy/aws-lbc-aws-load-balancer-controller`
#    로 푼다. 신규 클러스터도 ALBC 파드와 CRD 가 같은 sync 에서 병렬로 생겨 파드가 먼저 뜨면 같은
#    증상이 난다. ALBC 로그에 `Disabling ALBGatewayAPI` 가 있으면 재시작한다.
# ⚠️ 이 CR 의 finalizer 는 ALBC(다른 Application)가 처리한다. 등록 해제 때 ALBC 보다 먼저 prune
#    되도록 selector 가 decommission 라벨이 붙은 클러스터를 놓는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md ·
#    docs/architectures/gitops-hub-spoke/aws/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
            - key: decommission
              operator: DoesNotExist
  template:
    metadata:
      name: '{{name}}-gateway'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # CRD 보다 뒤에 적용되게 한다. ⚠️ wave 는 생성 순서만 정할 뿐 그 sync 의 완료를 기다리지
        # 않는다 — 실제 안전장치는 아래 SkipDryRunOnMissingResource 다.
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: platform
      source:
        # 이 저장소의 로컬 helm 차트다 — per-cluster 값을 주입해야 해서 평문이 아니다.
        repoURL: https://github.com/skax-ca/eks-platform-gitops.git
        targetRevision: main
        path: addons/gateway/shared-gateway
        helm:
          parameters:
            - name: environment
              value: '{{metadata.labels.environment}}'
      destination:
        server: '{{server}}'
        namespace: gateway-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # CRD 가 막 생긴 직후의 첫 sync 에서 dry-run 이 실패하는 것을 피한다.
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
