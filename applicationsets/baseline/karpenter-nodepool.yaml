# Karpenter NodePool/EC2NodeClass — baseline addon. 계층 2가 소유하는 인프라 CR 이다.
#
# 컨트롤러는 karpenter.yaml 이 갖는다. 이 CR 은 그 차트가 동봉한 CRD 가 선존재해야 적용되므로
#    sync-wave 5 다.
# ⛔ 이 ApplicationSet 을 티어로 쪼개지 않는다(uniform). targetRevision 이 이 저장소 자신이라 두 벌로
#    나눠도 둘 다 main 을 가리켜 승격이 기록되지 않는다. ⚠️ 그래서 컨트롤러 승격이 진행 중이면 이
#    차트가 두 CRD 버전 모두에서 유효해야 한다. 새 버전에서 생긴 필드가 필요하면 그 승격을 끝내고
#    커밋한다.
# 티어마다 갈려야 하는 값은 tier 라벨을 차트에 넘겨 values 안에서 고른다. AMI 핀이 그 경로를 쓴다 —
#    nonprd 줄과 prd 줄이 한 파일에 나란히 있어 승격 구간이 git 이력에 남는다.
# Terraform 전제: 노드 IAM role. 그 이름만 클러스터명에서 파생되지 않아 cluster Secret 의
#    karpenterNodeRole 라벨로 받는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nodepool
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # environment 라벨이 있는 cluster Secret 이면 값과
          # 무관하게 매칭한다(dev·hub·향후 spoke 전부) — ArgoCD 내장 in-cluster 항목에는
          # 라벨 자체가 없어 여기 걸리지 않는다.
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: '{{name}}-karpenter-nodepool'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: platform
      source:
        # 이 저장소의 로컬 helm 차트다. ⚠️ ApplicationSet 의 fasttemplate 은 **Application spec** 에만
        #    적용되고 git 경로 안의 파일에는 적용되지 않는다 ⇒ per-cluster 값을 넘기려면 helm 이 필요하다.
        #    이 경로는 root-app 의 include 범위 밖이라 root App 이 차트 파일을 읽을 일이 없다.
        repoURL: https://github.com/skax-ca/eks-platform-gitops.git
        targetRevision: main
        path: addons/karpenter/nodepool
        helm:
          parameters:
            - name: clusterName
              value: '{{name}}'
            # 🔑 클러스터명에서 파생할 수 없는 값이다(role 이름에 26자 hash 접미가 붙는다).
            #    그래서 라벨로 받는다.
            - name: nodeRole
              value: '{{metadata.labels.karpenterNodeRole}}'
            # 차트가 AMI 핀을 이 값으로 고른다. 라벨이 빠지면 템플릿이 required 로 실패해 Application
            #    이 에러로 선다 — 한쪽 티어 값이 조용히 반대편에 적용되는 것보다 낫다.
            - name: tier
              value: '{{metadata.labels.tier}}'
      destination:
        server: '{{server}}'
        # CR 은 cluster-scoped 라 이 ns 는 형식상 값이다.
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # ①이 CRD 를 막 만든 직후의 첫 sync 에서 dry-run 이 실패하는 것을 피한다.
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
