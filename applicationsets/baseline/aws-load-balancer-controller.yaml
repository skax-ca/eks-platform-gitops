# AWS Load Balancer Controller — baseline addon.
#
# helm 인 이유는 EKS community addon 에 ALBC 가 없어서다. 다른 경로가 없다.
# 네임스페이스가 kube-system 인 근거는 README 「addon 네임스페이스 규칙」이 갖는다. 새 addon에
#    이 값을 복사하지 않는다 — 전용 ns 신설이 기본 규칙이고 이 파일은 예외다.
# 🔑 AWS 전용 Gateway CRD(TargetGroupConfiguration 등)는 이 차트의 `crds/` 폴더가 이미 설치한다.
#    별도 addon 이 필요한 것은 표준 CRD(gateway.networking.k8s.io)뿐이고 gateway-api-crds.yaml 소관이다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # 트래픽을 받는 ALB 를 직접 움직이므로 비운영에서 먼저 확인하고 승격한다.
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-aws-lbc'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.5.0
          helm:
            releaseName: aws-lbc
            parameters:
              # 🔑 cluster Secret 의 이름이 곧 {{name}} 이고 실제 EKS 클러스터명이어야 한다.
              #    별칭을 쓰면 조용히 틀린다.
              - name: clusterName
                value: '{{name}}'
              # vpcId 가 아니라 태그로 찾는다. 노드 IMDSv2 hop limit=1 이라 파드에서 VPC 자동
              #    탐지가 안 되고(ec2imds context deadline exceeded 로 CrashLoop), AWS 발급 ID 는
              #    재구축마다 바뀌는 반면 Name 태그는 네이밍 규칙이 고정한다.
              #    ⛔ hop limit 을 2로 올리는 우회는 기각됐다 — 그 노드의 모든 파드가 노드 IAM role 을
              #       탈취할 수 있게 돼 Pod Identity 격리가 클러스터 전체에서 무너진다.
              #    ⚠️ 이 값이 틀려도 ArgoCD 는 Synced/Healthy 다. helm 값이라 실패가 런타임으로 밀린다.
              #    ⚠️ 태그를 여러 개 주면 AND 필터다. Name 하나로 유일성이 성립한다.
              - name: vpcTags.Name
                value: '{{metadata.labels.vpcName}}'
            valueFiles:
              - $values/addons/aws-load-balancer-controller/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # CRD 가 커서 client-side apply 의 애노테이션 크기 한도에 걸린다.
          - ServerSideApply=true
---
# nonprd 티어 — 규약은 README 「staged 전파」. 위 블록과 함께 고치고, 갈려도 되는 값은
# targetRevision 하나다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-aws-lbc'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.5.0
          helm:
            releaseName: aws-lbc
            parameters:
              - name: clusterName
                value: '{{name}}'
              - name: vpcTags.Name
                value: '{{metadata.labels.vpcName}}'
            valueFiles:
              - $values/addons/aws-load-balancer-controller/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
