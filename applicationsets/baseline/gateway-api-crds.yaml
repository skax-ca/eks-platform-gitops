# Gateway API 표준 CRD — baseline addon. CRD 만 설치한다.
#
# 🔑 컨트롤러는 aws-load-balancer-controller.yaml 이 그대로 담당한다. 이 CRD 가 있어도 AWS 리소스는
#    생기지 않는다 — Gateway API 타입을 apiserver 에 등록할 뿐이고, ALB 를 만드는 것은 gateway.yaml 이다.
# ⛔ AWS 전용 Gateway CRD 를 위한 별도 addon 을 만들지 않는다. ALBC 차트의 `crds/` 폴더가 이미
#    설치하므로, 또 만들면 같은 CRD 를 두 Application 이 소유하려는 충돌이 난다.
# 소스가 helm repo 가 아니라 git repo 인 이유: upstream 이 이 CRD 세트를 차트로 배포하지 않는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # ⚠️ 이름을 바꾸면 CRD 실물까지 prune 되고, 그 CRD 를 쓰던 Gateway·HTTPRoute 도 cascade 로
  #    사라진다. 이 addon 은 그 대가가 가장 크다(README 「ApplicationSet 공통 규약」).
  name: gateway-api-crds-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-gateway-api-crds'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/kubernetes-sigs/gateway-api.git
        targetRevision: v1.6.2
        # kustomization.yaml 이 없는 순수 YAML 디렉토리라 ArgoCD 가 Directory 타입으로 렌더한다.
        path: config/crd/standard
      destination:
        server: '{{server}}'
        # CRD 는 cluster-scoped 라 이 ns 는 형식상 값이다.
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # CRD 크기가 client-side apply 의 애노테이션 한도를 넘는다.
          - ServerSideApply=true
---
# nonprd 티어 — 규약은 README 「staged 전파」. 위 블록과 함께 고치고, 갈려도 되는 값은
# targetRevision 하나다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway-api-crds-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-gateway-api-crds'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/kubernetes-sigs/gateway-api.git
        targetRevision: v1.6.2
        path: config/crd/standard
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
