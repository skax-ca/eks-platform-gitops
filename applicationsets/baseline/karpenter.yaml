# Karpenter 컨트롤러 — baseline addon. CR(NodePool/EC2NodeClass)은 karpenter-nodepool.yaml.
#
# 네임스페이스가 kube-system 인 근거는 README 「addon 네임스페이스 규칙」이 갖는다. 새 addon에
#    이 값을 복사하지 않는다 — 전용 ns 신설이 기본 규칙이고 이 파일은 예외다.
# ⚠️ CR 쪽은 티어를 나누지 않아 양 티어가 같은 차트를 본다. 이 파일의 승격이 진행 중이면
#    그 차트가 두 CRD 버전 모두에서 유효해야 한다(karpenter-nodepool.yaml 헤더).
# Terraform 전제: 컨트롤러·노드 IAM role, 중단 SQS `Karpenter-<cluster>`, Pod Identity
#    association `kube-system/karpenter`, 노드 SG의 `karpenter.sh/discovery` 태그.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
---
# prd 티어 — 컨트롤러(OCI helm)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # 노드를 직접 만드는 컨트롤러라 비운영에서 먼저 확인하고 승격한다.
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-karpenter'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # CR(②)보다 먼저 만들어지게 한다. ⚠️ wave 는 생성 순서를 정할 뿐 sync 완료를 기다리지 않는다 —
        #    실제 안전장치는 ②의 SkipDryRunOnMissingResource 와 ArgoCD 의 재시도다.
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      sources:
        # OCI registry 다. Repository Secret 도 enableOCI 설정도 필요 없다 —
        # scheme 없는 repoURL 만으로 pull 된다.
        - repoURL: public.ecr.aws/karpenter
          chart: karpenter
          # 🔑 OCI 태그가 곧 chart 버전이다 — GitHub 릴리스 태그를 보면 "태그≠Chart.yaml"
          #    함정에 걸린다. 호환성 매트릭스는 클러스터 1.35에 >= 1.9 를 요구한다.
          targetRevision: 1.14.0
          helm:
            releaseName: karpenter
            parameters:
              # 없으면 helm template 이 실패한다. ⚠️ 그 실패는 rendered 0 + ComparisonError 라
              # egress 실패와 똑같이 보인다 — revision 이 해석됐으면 egress 가 아니라 값 문제다.
              - name: settings.clusterName
                value: '{{name}}'
              # SQS 이름이 클러스터명에서 파생되므로 라벨을 새로 만들지 않는다.
              - name: settings.interruptionQueue
                value: 'Karpenter-{{name}}'
            valueFiles:
              - $values/addons/karpenter/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
---
# nonprd 티어 — 규약은 README 「staged 전파」. 위 블록과 함께 고치고, 갈려도 되는 값은
# targetRevision 하나다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-karpenter'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      sources:
        - repoURL: public.ecr.aws/karpenter
          chart: karpenter
          targetRevision: 1.14.0
          helm:
            releaseName: karpenter
            parameters:
              - name: settings.clusterName
                value: '{{name}}'
              - name: settings.interruptionQueue
                value: 'Karpenter-{{name}}'
            valueFiles:
              - $values/addons/karpenter/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
