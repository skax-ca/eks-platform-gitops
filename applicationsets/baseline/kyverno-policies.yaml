# Kyverno PSS 정책 — baseline addon (업스트림 kyverno-policies 차트, ValidatingPolicy 11개).
#
# ⛔ 엔진(kyverno.yaml)과 **같은 마이너 라인**을 유지한다. 차트 번호를 맞추는 것이 아니다.
#    정책 내용만 보면 uniform 이 맞지만 엔진이 staged 라 이것도 따라간다 — 티어 안에서는 엔진과
#    정책이 항상 같은 라인이고, 차이는 승격 구간에만 있다.
# ⛔ policyType 을 적지 않는다. 차트 기본값이 ValidatingPolicy(CEL)이고 그것이 우리가 쓰는
#    타입이다. legacy ClusterPolicy 로 되돌리는 값을 넣으면 AppProject whitelist 와 커스텀 정책이
#    함께 어긋난다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-kyverno-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        # 이것이 없으면 ValidatingPolicy 11개가 영구 OutOfSync 다 — 엔진 쪽 CRD 와 같은 원인이다.
        #    차이 나는 spec.evaluation.admission.enabled·spec.evaluation.background.enabled 는 CRD
        #    스키마의 default 를 apiserver 가 채운 것이라 어느 매니저도 소유하지 않는다.
        #    ⚠️ ignoreDifferences 로 열거하면 차트가 기본값을 늘릴 때마다 목록을 따라 늘려야 한다.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno-policies
        targetRevision: 3.9.1
        helm:
          parameters:
            # 차트 기본 Fail 에서 바꾼 유일한 값이다. failurePolicy 는 **웹훅에 닿지 못할 때**
            #    무엇을 하는가이고, validationActions(Audit, 차트 기본)은 **정책을 위반했을 때**
            #    무엇을 하는가다. Audit + Fail 은 비정합이다 — 아무것도 막지 않기로 해 놓고 Kyverno 가
            #    죽으면 전부 막는다. background 스캔이 PolicyReport 를 계속 만들어 잃는 것은 실시간성뿐이다.
            #    ⚠️ Deny 로 전환할 때 Fail 로 **함께** 올린다. 한쪽만 바꾸면 다시 비정합이다.
            - name: failurePolicy
              value: Ignore
        # ⛔ validationActions·podSecurityStandard 를 적지 않는다. 차트 기본값(Audit·baseline)이
        #    우리가 원하는 값이고, 기본값을 옮겨 적으면 차트를 올릴 때 그 줄이 조용히 낡는다.
      destination:
        server: '{{server}}'
        # ValidatingPolicy 는 cluster-scoped 라 이 ns 는 형식상 값이다.
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # 엔진이 CRD 를 막 만든 직후의 첫 sync 에서 dry-run 이 실패하는 것을 피한다.
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
---
# nonprd 티어 — 규약은 README 「staged 전파」. 위 블록과 함께 고치고, 갈려도 되는 값은
# targetRevision 하나다. ⛔ 엔진의 nonprd 와 같은 마이너 라인을 유지한다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-kyverno-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno-policies
        targetRevision: 3.9.1
        helm:
          parameters:
            - name: failurePolicy
              value: Ignore
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
