# KEDA — opt-in 카탈로그 addon (이벤트 기반 오토스케일링).
#
# 전파 정책 3종(uniform·staged·opt-in)과 디렉토리가 다른 축이라는 것은 설계 문서가 갖는다.
# 네임스페이스는 전용 ns 신설 — 이 저장소의 기본 규칙이다. baseline 의 kube-system 은 예외이니
#    복사하지 않는다(README 「addon 네임스페이스 규칙」).
# Terraform 전제: 없다. AWS 스케일러(SQS·CloudWatch)를 쓰지 않아 IAM 이 0건이고, 이 addon 은
#    계층 2 안에서 닫힌다. ⚠️ AWS 스케일러가 필요해지면 Pod Identity association 을 연다.
# ⚠️ 이미지가 ghcr.io 다 — 다른 addon 대부분은 public.ecr.aws 라 노드 egress 경로가 다르다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keda
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # 라벨이 없는 클러스터는 이 팬아웃에 걸리지 않는다 = 구독하지 않은 것이다.
          matchLabels:
            addon-keda: enabled
  template:
    metadata:
      name: '{{name}}-keda'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://kedacore.github.io/charts
          chart: keda
          # ⚠️ 이 차트는 kubeVersion 제약(>= 1.23)이 있다. 올릴 때 확인한다.
          targetRevision: 2.20.2
          helm:
            valueFiles:
              - $values/addons/keda/values.yaml
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: keda
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # ⚠️ 자동 생성된 Namespace 도 AppProject 의 clusterResourceWhitelist 검사를 받는다.
          - CreateNamespace=true
          # CRD 6개 + APIService 가 커서 client-side apply 의 애노테이션 크기 한도에 걸린다.
          - ServerSideApply=true
