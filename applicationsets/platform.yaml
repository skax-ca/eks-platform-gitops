# 플랫폼 부모 — 등록된 클러스터마다 부모 Application <cluster>-platform 을 하나 만든다
#
# 부모는 addons/platform/ 차트를 렌더해 그 클러스터의 addon Application 전부를 wave 와 함께 만든다.
#    어느 addon 을 어떤 버전으로 받는지는 차트가 cluster Secret 라벨로 고른다. 이 파일은 라벨을
#    helm parameter 로 옮길 뿐이다.
# 🔑 addon 을 늘리거나 버전을 올릴 때 이 파일을 고치지 않는다. addons/platform/ 을 고친다.
#
# ⚠️ 해제는 2단계다. cluster Secret 에서 environment 라벨을 먼저 빼면 이 ApplicationSet 이 부모를
#    지우고, 부모의 finalizer 가 addon 을 wave 역순으로 지운다. 부모가 사라진 것을 확인한 뒤 cluster
#    Secret 을 지운다. Secret 을 먼저 지우면 ArgoCD 가 목적지를 잃어 spoke 리소스를 지우지 않고
#    기록만 버린다. CR 의 finalizer 와 그 CR 이 만든 AWS 리소스(ALB SG 등)가 남는다.
# ⚠️ 이름(platform)과 selector 는 배포된 순간 계약이다. 바꾸면 기존 부모가 삭제로 처리되어 전
#    클러스터의 addon 이 지워진다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md ·
#    docs/architectures/gitops-hub-spoke/ordering.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  # 라벨을 index 로 읽으려고 Go 템플릿을 쓴다. missingkey=error 는 .name·.server 오타를 빈
  #    문자열이 아니라 오류로 드러낸다.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          # 존재만 본다. ArgoCD 내장 in-cluster 항목에는 라벨 자체가 없어 여기 걸리지 않는다. hub 도
          #    cluster Secret 을 명시적으로 두는 이유다.
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: '{{ .name }}-platform'
      # ⛔ 빼지 않는다. root-app 과 달리 부모에는 cascade 가 있어야 해제 1단계가 addon 을 지운다.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/skax-ca/eks-platform-gitops.git
        targetRevision: main
        path: addons/platform
        helm:
          # 🔑 라벨은 전부 index 로 읽는다. 라벨 맵이 map[string]string 이라 없는 키가 빈 문자열이 되고,
          #    차트의 required 가 그 클러스터의 부모만 ComparisonError 로 세운다. .metadata.labels.x 로
          #    읽으면 missingkey=error 가 이 ApplicationSet 전체의 생성을 멈춘다.
          # ⛔ sprig get 을 쓰지 않는다. map[string]interface{} 만 받아 라벨 맵에서 `wrong type for value`
          #    로 실패하고, ApplicationSet 이 Application 을 하나도 만들지 않는다.
          parameters:
            - name: cluster.name
              value: '{{ .name }}'
            - name: cluster.server
              value: '{{ .server }}'
            - name: cluster.environment
              value: '{{ index .metadata.labels "environment" }}'
            - name: cluster.tier
              value: '{{ index .metadata.labels "tier" }}'
            - name: cluster.vpcName
              value: '{{ index .metadata.labels "vpcName" }}'
            - name: cluster.karpenterNodeRole
              value: '{{ index .metadata.labels "karpenterNodeRole" }}'
            - name: addons.keda
              value: '{{ index .metadata.labels "addon-keda" }}'
            - name: addons.clusterAutoscaler
              value: '{{ index .metadata.labels "addon-cluster-autoscaler" }}'
      # 부모는 hub 의 argocd 네임스페이스에 addon Application 을 만든다. addon 이 도는 곳은 각 addon
      #    Application 의 destination 이다.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          selfHeal: true
          # opt-in 해지(라벨 제거)가 이 prune 으로 이루어진다. ⚠️ 그래서 차트에서 addon 템플릿을 지우면
          #    등록된 전 클러스터에서 그 addon 이 wave 역순으로 지워진다.
          prune: true
