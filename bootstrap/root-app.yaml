# root Application (App-of-Apps) — 부트스트랩의 마지막 seed 대상
#
# 설계: skax-ca/iac-module-library docs/design/30-gitops-repo.md §4 · §4.1 seed 5단계
#
# ⭐ 자기소멸(self-superseding) — 이 파일은 workbench 에서 손으로 apply 되지만, apply 직후
#    자기 자신을 source 에 포함해 흡수(adopt)한다. 그 순간부터 이 리소스의 SSOT 는 사람이 아니라
#    저장소가 된다. 손으로 apply 하는 내용과 커밋본이 **바이트 단위로** 달라지면 영구 드리프트가 된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # finalizer 를 일부러 넣지 않는다 — 이 Application 을 지울 때 플랫폼 리소스 전체가
  # cascade 삭제되면 복구에 seed 를 다시 밟아야 한다.
spec:
  project: platform

  source:
    # self-managed 는 GitHub 를 직접 읽는다. 인증은 **GitHub App** repository Secret 이다(30 §1.1).
    # ⚠️ 관리형 Capability 는 여기에 CodeConnections 프록시 URL 을 쓴다 — 21 §1.7 갈림점 6.
    #    그 URL 은 account-id·region·connection-id 를 포함해 환경마다 다르다.
    repoURL: https://github.com/skax-ca/iac-platform-gitops.git
    targetRevision: main
    # 저장소 루트 전체를 훑는다 — projects/·clusters/·addons/ 가 모두 대상이며,
    # 새 디렉토리가 늘어도 이 파일은 불변이다(30 §1 O(1) 확장 규칙).
    path: .
    directory:
      recurse: true
      # 훑기 제외(k8s 매니페스트가 아닌 것):
      #   - clusters/**/values.yaml: helm values(30 §2.3 값 계약). ** 라 depth 무관 —
      #     clusters/<env>/<cluster-name>/values.yaml(중첩 구조)까지 제외한다.
      #     cluster-secret.yaml 은 제외 대상이 아니라 그대로 recurse(클러스터 등록 매니페스트).
      #   - bootstrap/argocd-values.yaml: ArgoCD 자신의 helm values(23 §2.1 자기 관리의 SSOT).
      #     ⚠️ 빼먹으면 root App 이 이것을 매니페스트로 오인해 sync 가 깨진다.
      #   - addons/karpenter/nodepool/**: 로컬 helm 차트(Chart.yaml + {{ }} 템플릿).
      #     ⚠️ 위 줄이 예고한 경우가 실제로 왔다(2026-08-10, ALBC·Karpenter 증분).
      #     이 차트는 addons/baseline/karpenter.yaml 의 ②ApplicationSet 이 소싱한다 —
      #     root-app 이 같은 파일을 매니페스트로도 읽으면 {{ }} 가 그대로 apply 돼 sync 가 깨진다.
      #     ⛔ addons/baseline/*.yaml 은 제외 대상이 **아니다** — 그건 진짜 매니페스트
      #        (ApplicationSet)이고 root-app 이 흡수해야 App-of-Apps 가 성립한다.
      exclude: '{clusters/**/values.yaml,bootstrap/argocd-values.yaml,addons/karpenter/nodepool/**}'

  destination:
    # ⚠️ projects/platform.yaml 의 destinations 와 같은 값이어야 한다.
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # 손으로 바꾼 것을 저장소 상태로 되돌린다 — 자기소멸 원칙의 집행 장치.
      selfHeal: true
      # ⚠️ prune 은 **의도적으로 끈다**. root 레벨에서 켜면 저장소 실수 하나가 platform
      #    AppProject 와 cluster Secret 까지 지워 seed 를 다시 밟아야 한다.
      #    하위 ApplicationSet 에서는 prune 을 켠다(30 §2.2·§4).
      prune: false
