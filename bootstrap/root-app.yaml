# root Application (App-of-Apps) — 부트스트랩의 마지막 seed 대상
#
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT)
#
# 자기소멸(self-superseding) — 이 파일은 workbench 에서 손으로 apply 되지만, apply 직후
#    자기 자신을 source 에 포함해 흡수(adopt)한다. 그 순간부터 이 리소스의 SSOT 는 사람이 아니라
#    저장소가 된다. 손으로 apply 하는 내용과 커밋본이 **바이트 단위로** 달라지면 영구 드리프트가 된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # finalizer 를 일부러 넣지 않는다 — 이 Application 을 지울 때 플랫폼 리소스 전체가
  # cascade 삭제되면 복구에 seed 를 다시 밟아야 한다.
spec:
  project: platform

  source:
    # self-managed 는 GitHub 를 직접 읽는다. 인증은 **GitHub App** repository Secret 이다.
    # ⚠️ 관리형 Capability 로 전환하면 여기에 CodeConnections 프록시 URL 을 쓴다 —
    #    그 URL 은 account-id·region·connection-id 를 포함해 환경마다 다르다.
    repoURL: https://github.com/skax-ca/eks-platform-gitops.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      # 🔴 allow-list 다. 여기 적힌 것만 매니페스트로 읽고 **그 밖은 무엇이든 무시한다.**
      #    로컬 차트(addons/<addon>/<chart>/)·helm values(clusters/**/values.yaml 포함)·이 저장소의
      #    도구 파일은 범위 밖이라 제외 장치(exclude·skip-rendering 마커)가 필요 없다.
      #
      #    deny-list(exclude·마커)를 쓰지 않는 이유: 저장소에 파일이 늘 때마다 **클러스터에
      #    적용된 현재 spec** 이 렌더할 범위가 저절로 넓어진다. root-app 은 자기 spec 을 git 에서
      #    읽어 갱신하는데 그 렌더가 옛 spec 으로 수행되므로, 옛 spec 이 걸러내지 못하는 파일이
      #    생기는 순간 ComparisonError 로 자기 갱신이 막힌다. allow-list 는 범위가 암묵적으로
      #    넓어지지 않아 이 spec 을 고치는 커밋도 옛 spec 으로 렌더가 된다.
      #
      #    ⚠️ 그래도 막히는 경우가 하나 남는다: 여기에 **렌더가 깨지는 파일이 든 경로**를 새로
      #       넣으면 그 spec 이 적용된 뒤부터 같은 이유로 자기 갱신이 멈춘다. 그 파일을 고치는
      #       커밋이 풀거나, argocd-seed.sh 를 root Application 단계만(--from 5 --to 5) 다시
      #       돌려 커밋본을 손으로 apply 한다(커밋본 그대로라 자기소멸 원칙 안이다).
      #
      #    매니페스트 디렉토리를 새로 만들면 이 목록에 한 줄 더한다. 그 디렉토리 안에서
      #    파일이 늘고 줄어드는 것은 이 파일과 무관하다.
      #      · projects/*.yaml                 AppProject
      #      · clusters/**/cluster-secret.yaml cluster Secret. `**` 라 env 깊이와 무관하다
      #      · addons/baseline/*.yaml          팬아웃 ApplicationSet
      #      · addons/catalog/*.yaml           opt-in ApplicationSet
      #      · bootstrap/root-app.yaml         이 파일 자신(자기소멸)
      #      · bootstrap/argocd-app.yaml       ArgoCD 자기 관리 Application
      #    bootstrap/argocd-values.yaml 은 helm values 라 넣지 않는다. argocd-app.yaml 이 다른
      #    source 에서 values 로 읽는다.
      include: '{projects/*.yaml,clusters/**/cluster-secret.yaml,addons/baseline/*.yaml,addons/catalog/*.yaml,bootstrap/root-app.yaml,bootstrap/argocd-app.yaml}'

  destination:
    # ⚠️ projects/platform.yaml 의 destinations 와 같은 값이어야 한다.
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # 손으로 바꾼 것을 저장소 상태로 되돌린다 — 자기소멸 원칙의 집행 장치.
      selfHeal: true
      # ⚠️ prune 은 **의도적으로 끈다**. root 레벨에서 켜면 저장소 실수 하나가 platform
      #    AppProject 와 cluster Secret 까지 지워 seed 를 다시 밟아야 한다.
      #    하위 ApplicationSet 에서는 prune 을 켠다.
      prune: false
