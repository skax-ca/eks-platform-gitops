# root Application (App-of-Apps) — 부트스트랩의 마지막 seed 대상
#
# 자기소멸(self-superseding): workbench 에서 손으로 apply 되지만 apply 직후 자기 자신을 source 에
#    포함해 흡수한다. ⚠️ 손으로 apply 하는 내용과 커밋본이 바이트 단위로 달라지면 그 차이가
#    영구 드리프트로 남는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/aws/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # finalizer 를 일부러 넣지 않는다 — 이 Application 을 지울 때 플랫폼 리소스 전체가
  # cascade 삭제되면 복구에 seed 를 다시 밟아야 한다.
spec:
  project: platform

  source:
    # self-managed 는 GitHub 를 직접 읽는다. 저장소가 public 이라 repository Secret 이 없고,
    # private 으로 돌아가면 이 Application 은 Unknown 에 머문다.
    repoURL: https://github.com/skax-ca/eks-platform-gitops.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      # allow-list 다. 여기 적힌 것만 매니페스트로 읽고 그 밖은 무엇이든 무시한다 — addons/ 전체와
      #    bootstrap/argocd-values.yaml 이 범위 밖이라 exclude 나 skip-rendering 마커가 필요 없다.
      #      · projects/*.yaml                 AppProject
      #      · clusters/**/cluster-secret.yaml `**` 라 env 깊이와 무관하다
      #      · applicationsets/*.yaml          부모를 만드는 ApplicationSet(platform.yaml)
      #      · bootstrap/root-app.yaml         이 파일 자신(자기소멸)
      #      · bootstrap/argocd-app.yaml       ArgoCD 자기 관리 Application
      #    매니페스트 디렉토리를 새로 만들면 한 줄 더한다.
      # ⚠️ `x/**/*.yaml` 은 x 바로 아래 파일을 잡지 않는다. `**` 뒤의 `/` 때문에 사이에 디렉토리가
      #    하나 이상 있어야 매치된다. 그러면 root App 이 그 파일을 조용히 빼고 Synced 로 남는다.
      # ⚠️ 렌더가 깨지는 파일이 든 경로를 여기 넣으면 그 spec 이 적용된 뒤부터 자기 갱신이 멈춘다.
      #    root App 은 자기 spec 을 클러스터에 적용된 옛 spec 으로 렌더한 뒤에야 갱신하기 때문이다.
      #    그 파일을 고치는 커밋이 풀거나, argocd-seed.sh 의 root Application 단계만 다시 돌려
      #    커밋본을 apply 한다.
      include: '{projects/*.yaml,clusters/**/cluster-secret.yaml,applicationsets/*.yaml,bootstrap/root-app.yaml,bootstrap/argocd-app.yaml}'

  destination:
    # ⚠️ projects/platform.yaml 의 destinations 와 같은 값이어야 한다.
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # 손으로 바꾼 것을 저장소 상태로 되돌린다 — 자기소멸 원칙의 집행 장치.
      selfHeal: true
      # ⚠️ prune 은 **의도적으로 끈다**. root 레벨에서 켜면 저장소 실수 하나가 platform
      #    AppProject 와 cluster Secret 까지 지워 seed 를 다시 밟아야 한다.
      #    하위 ApplicationSet 에서는 prune 을 켠다.
      prune: false
