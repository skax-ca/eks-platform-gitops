# ArgoCD 자기 관리 Application — 23 §2.1 "seed 1회 + 자기 관리" 의 **2단계(흡수)**
#
# 설계: skax-ca/iac-module-library docs/design/30-gitops-repo.md §2.10.1 (D-ARGOCD-ADOPT)
#       + docs/design/23-argocd-self-managed.md §2.1 · §5
#
# ⭐ seed(0단계)는 workbench 에서 사람이 `helm install` 했다. 이 파일이 그 결과를 **흡수**하고,
#    그 순간부터 ArgoCD 의 SSOT 는 helm 릴리스가 아니라 **이 저장소**가 된다.
#    이후 업그레이드·values 변경은 전부 Git → pull 이다. ⛔ helm CLI 를 다시 쓰지 않는다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 **ApplicationSet 이 아니라 Application 인 것이 이 파일의 첫 번째 결정이다**
#
#    ArgoCD 는 hub 에만 산다. cluster generator 로 팬아웃하면 **등록된 모든 스포크에 ArgoCD 가
#    통째로 설치된다.** ⚠️ 지금은 클러스터가 1개라 대상이 hub 자신뿐이어서 **정상으로 보인다** —
#    두 번째 클러스터가 등록되는 순간 터진다.
#    🔑 **단일 클러스터는 팬아웃 결함을 숨긴다.** 같은 형태의 함정이 이 증분에 하나 더 있다
#       (30 §2.10.0 판정 ① — Namespace whitelist).
#
# 📌 그래서 위치도 `addons/baseline/` 이 아니다. 그 디렉토리의 계약은 "전 클러스터 팬아웃" 이고
#    이것은 hub 단일이다. seed 산출물인 argocd-values.yaml 과 **같은 자리**에 둔다.
#    ⚠️ root App 은 `path: .` + `recurse: true` 라 위치와 무관하게 흡수한다(30 §1 O(1) 규칙) —
#       위치는 기능이 아니라 **사람이 읽는 의미**의 문제다.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ⭐ **이 이름이 helm release 이름이 된다 — 틀리면 흡수가 아니라 병렬 설치다.**
  #    argocd-seed.sh 의 ARGOCD_RELEASE 기본값이 `argocd` 이고(실측 :137), helm 은 릴리스 이름으로
  #    리소스 이름을 만든다(argocd-server·argocd-repo-server…). 이름이 어긋나면 ArgoCD 는
  #    `<다른이름>-server` 같은 **완전히 새로운 44개 리소스**를 만든다 — adopt 가 아니다.
  name: argocd
  namespace: argocd
  # ⛔ finalizer 를 넣지 않는다 — root-app 과 같은 이유. 이 Application 을 지울 때 ArgoCD 자신이
  #    cascade 삭제되면 seed 를 처음부터 다시 밟아야 한다.
spec:
  project: platform

  # ───────────────────────────────────────────────────────────────────────────
  # multi-source — 30 §2.5 (B) 가 예고한 메커니즘의 **첫 실전 사용**
  #   차트는 argo-helm 에 있고 values 는 이 저장소에 있다. 둘을 겹치려면 multi-source 가 필요하다.
  # ───────────────────────────────────────────────────────────────────────────
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      # ⛔ **이 증분에서 차트를 올리지 않는다.** 23 §5 의 정확 핀 그대로이고, seed 가 설치한 값과 같다.
      #    흡수와 업그레이드를 같은 커밋에 넣으면 실패했을 때 "흡수가 문제인가 새 차트가 문제인가"를
      #    가를 수 없다 — 23 §5 가 helm CLI 를 v4 대신 v3 로 핀할 때 쓴 것과 **같은 셈법**이다.
      #    ⭐ 게다가 자기소멸 원칙이 이것을 요구한다: 흡수 대상은 seed 산출물의 **바이트 동일 사본**이어야
      #       한다. 버전을 올리면 그건 흡수가 아니라 업그레이드이고, 다른 행위다.
      targetRevision: 10.3.0
      helm:
        # 🔴 명시가 중복처럼 보이지만 **죽은 설정이 아니다.** ArgoCD 는 release 이름을 Application
        #    이름에서 가져오므로 기본값과 같지만, 그 결합은 **이름을 바꾸는 순간 조용히 깨진다.**
        #    값으로 고정해 argocd-seed.sh 의 ARGOCD_RELEASE 와의 연결을 문서화한다.
        releaseName: argocd
        # $values 는 아래 `ref: values` source 를 가리킨다.
        # ⭐ 이 파일은 root-app 의 `exclude` 대상이기도 하다(bootstrap/root-app.yaml). **모순이 아니다** —
        #    exclude 는 *root App 이 이것을 k8s 매니페스트로 오인하지 않게* 하는 설정이고,
        #    여기서는 *다른 Application 의 다른 source 에서 helm values 로* 읽는다.
        #    🔑 exclude 는 파일을 숨기는 것이 아니라 **한 Application 의 훑기 대상에서 빼는 것**이다.
        valueFiles:
          - $values/bootstrap/argocd-values.yaml

    # 값 참조 전용 source — `ref` 만 있고 path/chart 가 없으므로 **렌더 대상이 아니다.**
    - repoURL: https://github.com/skax-ca/iac-platform-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # ───────────────────────────────────────────────────────────────────────────
  # 🔴 **1단계 — `automated` 를 일부러 넣지 않았다. 지금 이 Application 은 "비교만" 한다.**
  #
  #    흡수 순간 diff 가 있으면 즉시 적용되고, 그 적용 대상이 **application-controller 자신**이다.
  #    sync 를 수행하는 주체가 sync 도중에 재시작하면 무엇이 적용되고 무엇이 안 됐는지 알 수 없다.
  #    ⇒ 먼저 `argocd app diff argocd` 로 helm install ↔ helm template 차이를 **사람이 읽는다.**
  #    ⭐ 이것은 egress canary 와 **같은 도구를 다른 질문에 쓰는 것**이다(30 §2.9) —
  #       syncPolicy 에 automated 가 없으면 배포를 만들지 않는다.
  #
  #    2단계(별도 PR)에서 아래를 추가한다:
  #        automated: { selfHeal: true, prune: false }
  #    ⛔ **prune 은 2단계에서도 켜지 않는다.** root App 과 같은 이유에 더해, seed 의 helm 잔존물
  #       (Secret `sh.helm.release.v1.argocd.v1`)과 GitOps 관리 밖 Secret(`argocd-repo-gitops`)이
  #       "저장소에 없는 리소스"로 분류될 수 있다.
  #
  #    ⚠️ **syncPolicy 를 통째로 비우지는 않았다** — syncOptions 는 처음부터 넣는다.
  #       ServerSideApply=true 가 있어야 diff 가 server-side dry-run apply 로 계산되고,
  #       없으면 1단계에서 본 diff 와 2단계에서 실제 적용될 결과가 **다른 계산**이 된다.
  #       🔑 판정 단계와 실행 단계는 같은 방식으로 계산해야 한다.
  # ───────────────────────────────────────────────────────────────────────────
  syncPolicy:
    syncOptions:
      # 🔴 **이것이 Secret/argocd-secret 을 지킨다 — 이 증분의 가장 큰 위험이다.**
      #    차트는 argocd-secret 을 **data 없이**(메타데이터 + type: Opaque 만) 렌더한다.
      #    그 자리는 argocd-server 가 런타임에 admin 비밀번호 해시·server.secretkey·TLS 를 채운다.
      #    SSA 는 **자신이 선언한 필드만 소유**하므로 차트가 data 를 선언하지 않는 한 기존 키를
      #    건드리지 않는다. ⛔ Replace=true 를 쓰면 객체를 통째로 교체해 **정확히 그 사고**를 낸다.
      #    📌 ignoreDifferences 를 미리 넣지 않았다 — 필요한지는 1단계 diff 가 답한다.
      - ServerSideApply=true
