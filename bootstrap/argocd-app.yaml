# ArgoCD 자기 관리 Application — workbench 에서 helm install 한 결과를 흡수한다.
#
# 흡수한 순간부터 ArgoCD 의 SSOT 는 helm 릴리스가 아니라 이 저장소다. ⛔ 이후 helm CLI 를
#    다시 쓰지 않는다. 업그레이드·values 변경은 전부 Git → pull 이다.
# 🔑 ApplicationSet 이 아니라 Application 인 이유: ArgoCD 는 hub 에만 산다. cluster generator 로
#    팬아웃하면 등록된 모든 스포크에 ArgoCD 가 통째로 설치된다. ⚠️ 클러스터가 하나뿐일 때는
#    대상이 hub 자신뿐이라 정상으로 보이고, 두 번째 클러스터가 등록되는 순간 그 설치가 일어난다.
# 위치가 applicationsets/ 가 아닌 것도 같은 이유다 — 그 디렉토리의 계약은 전 클러스터 팬아웃이다.
#    ⚠️ root-app.yaml 의 include 가 이 파일을 경로로 명시한다. 옮기면 그 목록도 함께 고친다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/aws/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ⚠️ 이 이름이 helm release 이름이 된다. argocd-seed.sh 의 ARGOCD_RELEASE 와 어긋나면 흡수가
  #    아니라 병렬 설치가 된다 — ArgoCD 가 `<다른이름>-server` 같은 새 리소스를 통째로 만든다.
  name: argocd
  namespace: argocd
  # ⛔ finalizer 를 넣지 않는다 — root-app 과 같은 이유. 이 Application 을 지울 때 ArgoCD 자신이
  #    cascade 삭제되면 seed 를 처음부터 다시 밟아야 한다.
  # ⛔ compare-options: ServerSideDiff 를 여기 넣지 않는다. 흡수 직후의 OutOfSync 는 ArgoCD 자신의
  #    tracking-id 애노테이션 때문이고, 그것은 desired 가 실제로 선언하는 필드라 diff 전략으로
  #    사라지지 않는다. sync 를 한 번 하면 해소된다.
spec:
  project: platform

  # multi-source — 차트는 argo-helm 에, values 는 이 저장소에 있다.
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      # ⛔ 흡수와 차트 업그레이드를 같은 커밋에 넣지 않는다. 흡수 대상은 seed 산출물의 바이트
      #    동일 사본이어야 하고, 버전을 올리면 실패했을 때 어느 쪽이 원인인지 가를 수 없다.
      targetRevision: 10.9.1
      helm:
        # 기본값과 같지만 명시한다 — ArgoCD 는 release 이름을 Application 이름에서 가져오므로,
        #    그 결합은 이름을 바꾸는 순간 조용히 깨진다.
        releaseName: argocd
        # argocd-values.yaml 은 root App 의 include 범위 밖이다. root App 은 그것을 매니페스트로
        #    읽지 않고, 여기서만 helm values 로 읽는다.
        valueFiles:
          - $values/bootstrap/argocd-values.yaml

    - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # ⚠️ automated 를 켜기 전에 diff 가 tracking-id 애노테이션뿐인지 확인한다. sync 대상이
  #    application-controller 자신이라, 실질 변경이 있으면 sync 주체가 sync 도중에 재시작한다.
  syncPolicy:
    automated:
      # 손으로 바꾼 것을 저장소 상태로 되돌린다 — 자기소멸 원칙의 집행 장치(root-app 과 같다).
      selfHeal: true
      # ⛔ prune 을 켜지 않는다 — root App 과 같은 이유로, 저장소 실수 하나가 ArgoCD 자신의
      #    구성 요소를 지운다.
      prune: false
    syncOptions:
      # 🔑 이것이 Secret/argocd-secret 을 지킨다. 차트는 그 Secret 을 data 없이 렌더하고, 그 자리는
      #    argocd-server 가 런타임에 admin 비밀번호 해시·server.secretkey·TLS 로 채운다. SSA 는
      #    자신이 선언한 필드만 소유하므로 차트가 선언하지 않는 기존 키를 건드리지 않는다.
      #    ⛔ Force=true(delete/create)와 Replace=true(객체 통째 교체)를 넣지 않는다. 특히 Replace 는
      #       공식 문서상 ServerSideApply 보다 우선해서, 넣으면 이 보호가 조용히 무력화된다.
      - ServerSideApply=true
