# ArgoCD helm values — seed 의 helm install 입력이자 이후 자기 관리의 SSOT
#
# 자기소멸 원칙이 이 파일에도 걸린다. `helm install -f` 에 넘기는 values 는 이 커밋본 그대로여야
#    한다. ⛔ `--set` 을 쓰지 않는다 — 그 차이가 영구 드리프트로 남는다.
# ⚠️ 이 파일은 k8s 매니페스트가 아니라서 root-app.yaml 의 include 목록에 없다. 넣으면 root App 이
#    매니페스트로 오인해 렌더가 깨진다.
# 🔑 차트 기본값과 다른 것만 적는다. 기본값을 옮겨 적으면 차트를 올릴 때 그 줄이 조용히 낡는다.
#    아래 「기본값을 유지하는 것」이 그 판단의 기록이다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/aws/

# 전 컴포넌트를 system 노드그룹에 고정한다. tolerations 로 CriticalAddonsOnly taint 를 넘고 nodeSelector 로
#    그 노드만 고른다. 한 축만 걸면 고정이 아니다(eks-reference-infra `docs/runbooks.md` 「노드 배치」).
#   고정하는 이유: 이 ArgoCD 가 등록된 전 클러스터를 reconcile 한다. Karpenter 노드에 서면 drift·
#      consolidation 으로 노드가 교체될 때마다 재시작하고, 그 시점을 우리가 고르지 못한다. system
#      노드그룹은 값을 올리는 커밋으로만 교체된다.
#   ⚠️ 차트 기본값은 tolerations 가 전부 비어 있다. 컴포넌트별 키가 global 로 떨어지므로 여기 하나면
#      argo-cd 차트의 전 컴포넌트에 적용된다. nodeSelector 는 차트 기본값(kubernetes.io/os: linux)에
#      병합된다.
#   ⛔ redis-ha 는 서브차트라 global 이 닿지 않는다. 아래 redis-ha 블록에 같은 값을 다시 적는다.
global:
  nodeSelector:
    workload-class: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

# ── 고가용성 ─────────────────────────────────────────────────────────────────
# 차트 README 「High Availability」의 "HA mode without autoscaling" 값이다. hub 의 ArgoCD 하나가 전
#    spoke 의 pull 을 맡으므로 노드 한 대의 교체가 UI·API·매니페스트 렌더를 멈추지 않게 한다.
# ⛔ system 노드가 3대 이상이어야 한다. redis-ha 의 redis 3개와 haproxy 3개가 각각 서로 다른 노드를
#    요구한다(hardAntiAffinity). 2대면 세 번째 파드가 Pending 으로 남고 seed 의 helm install 이
#    끝나지 않는다. 노드 수는 eks-reference-infra 의 live/hub/eks/main.tf 가 정한다.
# controller.replicas 는 1 이다(차트 기본, HA 예시도 1). 복제본을 늘리는 것은 클러스터를 나눠 맡는
#    sharding 이고 대기 복제본이 아니다. controller 가 재시작하는 동안 reconcile 이 멈추고, desired
#    state 는 Git 에 그대로 있다.
# autoscaling 을 쓰지 않는 이유: 이 규모에서 server·repo-server 의 부하가 복제본 수를 움직일 만큼
#    변하지 않는다. 고정 2개가 읽기 쉽다.
redis-ha:
  enabled: true
  nodeSelector:
    workload-class: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  # 노드 교체가 redis 를 한 번에 하나만 내리게 한다. 셋 중 둘이 남아야 sentinel 이 master 를 고른다.
  podDisruptionBudget:
    maxUnavailable: 1
  haproxy:
    podDisruptionBudget:
      maxUnavailable: 1

# PDB 는 차트의 HA 예시에 없고 이 저장소가 더한다. 복제본이 2개여도 PDB 가 없으면 노드 교체가 둘을
#    함께 비울 수 있다.
# ⛔ controller 에는 PDB 를 두지 않는다. 복제본이 하나라 PDB 가 eviction 을 전부 막고, 관리형
#    노드그룹의 교체가 15분 뒤 PodEvictionFailure 로 실패한다.
server:
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1

repoServer:
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1

# dex 를 끈다. OIDC 직결이면 불필요하고, 켜 두면 쓰지 않는 파드가 하나 도는 죽은 경로가 된다.
#   ⚠️ dex 를 경유해야 하는 IdP(SAML-only 등)를 쓰게 되면 그때 다시 켠다.
dex:
  enabled: false

# notifications controller 를 끈다. 알림을 쓰는 소비자가 이 값을 true 로 켠다.
notifications:
  enabled: false

configs:
  cm:
    # 부모의 리소스 트리 노드에 addon 이름과 wave 를 태그로 띄운다. 트리 노드 태그는 라벨이 아니라
    #    컨트롤러가 채우는 리소스 info 라서, 여기 적은 라벨 키만 info 로 올라간다.
    # ⚠️ 전역이라 같은 키를 가진 모든 리소스에 태그가 붙는다. addon. 접두사로 다른 차트와 겹치지 않게 한다.
    resource.customLabels: addon.name,addon.wave
    # 🔑 부모 Application(<cluster>-addons)의 sync-wave 가 addon 설치 순서가 되게 한다. ArgoCD 는
    #    argoproj.io/Application 의 health 평가를 1.8 에서 뺐고 지금도 내장 체크가 없다. 이 Lua 가
    #    없으면 부모가 addon Application 을 만들자마자 다음 wave 로 넘어가 wave 가 생성 순서만 정한다.
    #    앞부분은 ArgoCD 1.7→1.8 업그레이드 문서의 Lua 다.
    # 🔑 addon Application(addon.name 라벨)은 아래 둘이 다 맞아야 Healthy 다. status.health 는 클러스터에
    #    있는 리소스만으로 계산돼서, 그것만 보면 부모가 기다리지 않고 다음 wave 로 넘어간다.
    #      ① Synced 다 — 막 만들어진 Application 은 아무것도 배포하지 않은 채 OutOfSync + Healthy 다
    #      ② sync 가 돌고 있지 않다 — 리소스는 맞췄어도 hook(마이그레이션 Job 등)이 남아 있을 수 있다
    # ⛔ 라벨 조건을 빼지 않는다. 전역 설정이라 root-app·자기 관리 Application·부모에도 이 Lua 가 걸린다.
    #    조건 없이 걸면 OutOfSync 인 것이 하나만 있어도 root-app 의 health 가 Progressing 에 머문다.
    # ⚠️ addon 이 OutOfSync 로 고착되면 리소스가 전부 Healthy 여도 부모가 그 wave 에서 멈춘다. 푸는
    #    방법은 README 「부모 Application — 클러스터마다 하나」의 ⚠️ 가 갖는다.
    # ⚠️ root-app 의 health 가 이 파일의 자기 관리 Application 과 부모들의 health 를 반영한다.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      local labels = obj.metadata.labels
      if hs.status == "Healthy" and labels ~= nil and labels["addon.name"] ~= nil then
        local waiting = nil
        local op = obj.status.operationState
        if obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
          waiting = "waiting for sync"
        elseif op ~= nil and op.phase == "Running" then
          waiting = "waiting for sync operation to finish"
        end
        if waiting ~= nil then
          hs.status = "Progressing"
          hs.message = waiting
        end
      end
      return hs

# ── 기본값을 유지하는 것 — 판단의 기록 (여기에 값을 적지 않는다) ──
# server.service.type: ClusterIP
#   노출을 만들지 않는다. 사람은 workbench 경유 port-forward 로 닿는다.
#   ⛔ internal ALB + Ingress 는 ACM·Route53·global.domain·SG 가 새로 필요하고 고객사마다 다르다.
#
# crds.install: true · crds.keep: true
#   ⚠️ uninstall 해도 CRD 가 남는다. 관리형 addon 의 delete_propagation_policy=RETAIN 과 같은
#      성격이라, "관리형만 지저분하게 남는다"는 대비는 성립하지 않는다.
#
# configs.params."server.insecure": (미설정 → TLS 유지)
#   argocd-server 는 자체 서명 인증서로 HTTPS 를 서빙한다. port-forward 로 접속하면
#   https://localhost:8080 에서 인증서 경고가 뜬다 — **정상이다.**
#   ⛔ insecure=true 로 끄지 않는다: 편의를 위해 클러스터 내부 트래픽의 TLS 를 없애는 교환이다.
#
# global.domain: argocd.example.com (chart 기본)
#   ingress·cert·SSO·notifications 가 전부 이 값을 쓰는데 **우리는 그 넷을 다 안 쓴다** → 무해하다.
#   ⛔ 가짜 도메인을 지어 넣지 않는다. Ingress 를 도입할 때 실제 값을 넣는다.
