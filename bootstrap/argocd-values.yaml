# ArgoCD helm values — seed 0단계의 입력이자, 이후 자기 관리(self-management)의 SSOT
#
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT)
# chart: argo-cd 10.3.0 (appVersion v3.5.0) — 정확 핀
#
# 자기소멸(self-superseding) 원칙이 이 파일에도 걸린다.
#    `helm install -f` 에 넘기는 values 는 **이 커밋본 그대로**여야 한다.
#    ⛔ `--set` 을 쓰지 않는다 — 그 차이가 영구 드리프트로 남는다.
#
# ⚠️ 이 파일은 k8s 매니페스트가 아니다 → bootstrap/root-app.yaml 의 exclude 대상이다.
#    빼먹으면 root App 이 이것을 매니페스트로 오인해 sync 가 깨진다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔑 **여기에는 chart 기본값과 다른 것만 적는다.**
#    기본값을 그대로 옮겨 적으면 chart 를 올릴 때 그 줄이 조용히 낡는다.
#    아래 "기본값을 유지하는 것" 주석이 그 판단의 기록이다.
# ─────────────────────────────────────────────────────────────────────────────

# system 관리형 노드그룹의 workload-class=system NoSchedule taint를 전 컴포넌트가 넘도록 한다.
#   ⚠️ hub 실제 seed에서 발견 — chart 기본값(전부 tolerations: [])은 이 taint를
#      모른다. redis-secret-init Job이 가장 먼저 걸린다(다른 파드보다 먼저 스케줄되어서일 뿐,
#      나머지 컴포넌트도 같은 taint 아래서는 똑같이 막힌다 — Job이 유일한 피해자가 아니다).
#      cert-manager(Terraform community addon)에서 이미 같은 taint로 겪은 문제와 같은 원인이다.
#   차트 values 확인(`helm show values argo/argo-cd --version 10.3.0`): 컴포넌트별 tolerations
#      키가 전부 "@default -- defaults to global.tolerations"라 여기 하나로 전체에 적용된다.
global:
  tolerations:
    - key: workload-class
      operator: Equal
      value: system
      effect: NoSchedule

# dex 를 끈다.
#   seed 는 local admin 으로 시작하고, 이후 인증은 configs.cm.oidc.config 를 소비자가 채운다.
#   OIDC 직결이면 dex 는 불필요하고, 켜 두면 쓰지 않는 파드가 하나 도는 **죽은 경로**가 된다.
#   ⚠️ dex 를 경유해야 하는 IdP(예: SAML-only)를 쓰게 되면 그때 다시 켠다.
dex:
  enabled: false

# notifications controller 를 끈다.
#   ⚠️ 관리형 Capability 로 전환하는 조건 중 하나가 "Notifications 가 필요한 고객사"라는 것과
#      모순처럼 보일 수 있다. 모순이 아니다 — **그 기능이 필요한 고객사가 이 값을 true 로 켠다.**
#      baseline 이 기본으로 켜 두는 것과는 다른 질문이다.
#   즉 이 줄은 "기능을 막는 것"이 아니라 **"기본값을 안 켜는 것"**이고, 그 기능이 실제로 필요한
#   고객사의 유일한 진입점이다.
notifications:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 기본값을 유지하는 것 — 판단의 기록 (여기에 값을 적지 않는다)
# ─────────────────────────────────────────────────────────────────────────────
# server.service.type: ClusterIP
#   노출을 만들지 않는다. 사람은 workbench 경유 port-forward 로 닿는다.
#   ⛔ internal ALB + Ingress 는 ACM·Route53·global.domain·SG 가 새로 필요하고 고객사마다 다르다.
#
# redis-ha.enabled: false · 각 컴포넌트 replicas: 1
#   현재 유일한 실증 환경이 dev 단일 클러스터다.
#   HA 가 필요해지면 redis-ha.enabled 와 replicas 를 소비자 값으로 켠다.
#   ⚠️ hub SPOF 의 비용은 "복구까지 pull 이 멈춘다"이고, desired state 는 Git 에 그대로 있다.
#
# crds.install: true · crds.keep: true
#   ⚠️ uninstall 해도 CRD 가 남는다. 관리형 addon 의 delete_propagation_policy=RETAIN 과 같은
#      성격이라, "관리형만 지저분하게 남는다"는 대비는 성립하지 않는다.
#
# configs.params."server.insecure": (미설정 → TLS 유지)
#   argocd-server 는 자체 서명 인증서로 HTTPS 를 서빙한다. port-forward 로 접속하면
#   https://localhost:8080 에서 인증서 경고가 뜬다 — **정상이다.**
#   ⛔ insecure=true 로 끄지 않는다: 편의를 위해 클러스터 내부 트래픽의 TLS 를 없애는 교환이다.
#
# global.domain: argocd.example.com (chart 기본)
#   ingress·cert·SSO·notifications 가 전부 이 값을 쓰는데 **우리는 그 넷을 다 안 쓴다** → 무해하다.
#   ⛔ 가짜 도메인을 지어 넣지 않는다. Ingress 를 도입할 때 실제 값을 넣는다.
