# 플랫폼 AppProject — 계층 2(플랫폼 GitOps)의 가드레일
#
# seed 3단계다. 4·5단계(cluster Secret·root App)가 이 프로젝트를 참조하므로 반드시 먼저 선다.
# ⚠️ ArgoCD 의 `default` AppProject 는 세 목록이 전부 '*' 인 완전 개방 상태다. 플랫폼 리소스는
#    이 전용 프로젝트에만 둔다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/aws/
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: 플랫폼팀 소유 계층 2 리소스 (클러스터 등록·addon·컨트롤러 설정)

  # self-managed 에서는 강제가 아니지만 규약으로 argocd 하나에 고정한다 — 관리형 Capability 로
  # 전환해도 매니페스트가 그대로 통하게 하기 위해서다.
  sourceNamespaces:
    - argocd

  # ⚠️ destinations·clusterResourceWhitelist 와 별개의 제3 가드레일이다 — Application 의
  #    repoURL 이 여기 없으면 InvalidSpecError 로 sync 자체가 안 선다. baseline 이든 catalog 든
  #    같다. addon 을 추가할 때마다 그 chart repo 를 여기 추가한다.
  sourceRepos:
    # 이 저장소 — seed 매니페스트와 로컬 차트.
    - https://github.com/skax-ca/eks-platform-gitops.git
    # ALBC
    - https://aws.github.io/eks-charts
    # Karpenter. ⚠️ OCI registry 라 scheme 을 쓰지 않는다.
    - public.ecr.aws/karpenter
    # ArgoCD 자기 관리 — 이 줄이 없으면 bootstrap/argocd-app.yaml 이 sync 조차 서지 않는다.
    - https://argoproj.github.io/argo-helm
    # Kyverno. 엔진과 정책 두 차트가 같은 repo 에 있어 줄은 하나다. 후행 슬래시는 upstream 이
    # index.yaml 을 서빙하는 형태 그대로다.
    - https://kyverno.github.io/kyverno/
    # KEDA
    - https://kedacore.github.io/charts
    # Cluster Autoscaler
    - https://kubernetes.github.io/autoscaler
    # Gateway API 표준 CRD. ⚠️ helm repo 가 아니라 git repo 라 repoURL 이 호스트가 아니라 저장소다.
    - https://github.com/kubernetes-sigs/gateway-api.git

  # 새 클러스터를 등록해도 이 목록은 편집하지 않는다 — hub 는 고정 URL 하나, spoke 는 region
  # 단위 glob 하나로 덮는다. namespace '*' 는 플랫폼 계층이 kube-system 등 시스템 ns 에 addon 을
  # 배포하기 때문이다.
  destinations:
    # self-managed ArgoCD 는 자신이 도는 클러스터를 이 URL 로 가리킨다.
    - server: https://kubernetes.default.svc
      namespace: '*'
    # spoke — cross-account EKS API endpoint. 이 값은 계정마다 다르고 같은 클러스터라도 완전
    #    재구축하면 새로 발급되므로, 정확한 값을 박아두면 재구축마다 이 파일도 고쳐야 한다.
    #    region 까지만 고정하는 이유다. ArgoCD 의 glob 은 `.` 을 구분자로 보지 않아 `*` 가
    #    endpoint 앞부분 전체를 삼킨다.
    # 🔑 계정을 특정하지 않아도 안전한 것은 destinations 가 유일한 게이트가 아니기 때문이다.
    #    실제 접근은 cluster-secret 을 커밋할 git 권한과 spoke 쪽 Role trust policy 가 막는다.
    #    여기서 막는 사고는 "저장소에 실수로 들어온 매니페스트"다.
    - server: 'https://*.ap-northeast-2.eks.amazonaws.com'
      namespace: '*'

  # 기본 차단으로 시작해 addon 마다 필요한 kind 만 연다. 목록은 각 차트를 렌더해 cluster-scoped
  # 항목을 추린 결과이고, 대부분의 addon 은 아래 ALBC 5종과 겹쳐 추가할 것이 없다.
  #
  # 🔑 self-managed 에서 이 목록이 유일한 실질 가드레일이다. argo-cd 차트 기본값이 application
  #    controller 에 cluster-admin 을 주므로 apiserver 쪽에는 막는 층이 없다. "어차피 cluster-admin
  #    이니 형식"이 아니다 — 이 목록이 막는 것은 저장소에 실수로 들어온 매니페스트다.
  clusterResourceWhitelist:
    # ALBC — 아래 5종이 다른 addon 대부분을 함께 덮는다.
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    # Karpenter — 컨트롤러 차트는 위 5종에 다 걸린다. 아래 둘은 우리가 만드는 CR 이다.
    # ⛔ karpenter.sh/NodeClaim 은 넣지 않는다. 컨트롤러가 NodePool 로부터 만드는 중간 리소스라
    #    ArgoCD 가 배포하지 않는다. 틀렸다면 sync 시 "resource not permitted in project" 로 드러난다.
    - { group: karpenter.sh, kind: NodePool }
    - { group: karpenter.k8s.aws, kind: EC2NodeClass }
    # 전용 ns addon(Kyverno·KEDA)용. ⚠️ CreateNamespace=true 로 자동 생성되는 Namespace 도 이
    #    목록의 검사를 받는다. ns 가 이미 있으면 검사 자체가 없어, 손으로 먼저 만들면 이 줄 없이도
    #    통과하고 두 번째 클러스터에서만 깨진다.
    - { group: "", kind: Namespace }
    # Kyverno 가 배포하는 정책 CR — 업스트림 PSS 11개와 우리 커스텀 정책이 같은 kind 다.
    #    ⛔ legacy kyverno.io/ClusterPolicy 를 여기 두지 않는다. Kyverno v1.20 이 그 타입을 지워
    #       만들 수 없는 리소스가 되고, 남겨두면 쓰이지 않는 권한만 열어 두는 셈이다.
    #    ⚠️ Kyverno 의 ValidatingWebhookConfiguration 은 렌더 결과에 없다 — 컨트롤러가 런타임에
    #       동적 등록하므로 ArgoCD 가 소유하지 않는다. 뒤집으면 웹훅이 잘못돼도 Application 은
    #       Synced Healthy 로 보인다는 뜻이다.
    - { group: policies.kyverno.io, kind: ValidatingPolicy }
    # KEDA 의 external.metrics APIService. ⚠️ 이것이 깨지면 그 API 그룹 전체가 죽는다. 계층 1 의
    #    metrics-server 와는 그룹이 달라 충돌하지 않는다. 지금은 소비자가 없어 무해하지만 HPA 가
    #    쓰기 시작하면 KEDA 장애가 곧 HPA 장애다 — 그때 가용성 요구를 다시 본다(현재 replicas 1).
    - { group: apiregistration.k8s.io, kind: APIService }
    # Gateway API 표준 CRD 디렉토리에 든 ValidatingAdmissionPolicy 한 쌍(GatewayClass 재검증용).
    #    CRD 와 다른 kind 라 별도로 열어야 한다.
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding }
    # GatewayClass. Gateway·LoadBalancerConfiguration 은 namespace-scoped 라 아래가 덮는다.
    - { group: gateway.networking.k8s.io, kind: GatewayClass }

  # namespace 스코프는 전면 허용 — 플랫폼 계층은 관리자 tier 다.
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
