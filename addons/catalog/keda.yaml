# KEDA — ②opt-in 카탈로그 addon (이벤트 기반 오토스케일링)
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
#
# **`addons/catalog/` 의 첫 파일이다.** `addons/baseline/`(등록만 하면 배포)과 달리, 팀이 라벨로
#    옵트인해야 배포되는 카탈로그 addon 의 실물 예시다.
#
# ─────────────────────────────────────────────────────────────────────────────
# **갈리는 지점은 generator selector 하나뿐이다**
#
#    전파 정책은 셋이고 addon 마다 하나를 고른다(조합하지 않는다):
#      uniform : matchExpressions [{key: environment, operator: Exists}] → 등록된 전 클러스터
#      staged  : matchLabels {tier: <값>} 으로 ApplicationSet 을 값별 분리 → 티어별 승격
#      opt-in  : matchLabels {addon-keda: enabled}                       → **구독한 클러스터만**
#
#    ⚠️ 디렉토리와 정책은 **다른 축**이다. `addons/baseline/` 에는 uniform(kyverno)과
#       staged(karpenter·ALBC·gateway-api-crds)가 함께 있고, `addons/catalog/` 가 opt-in 전용이다.
#       디렉토리는 *"팀이 고르는가"* 를, 정책은 *"누가 받고 어떤 버전을 받는가"* 를 가른다.
#
#    ⇒ 구독은 cluster Secret 에 라벨을 다는 것으로 이뤄진다
#      (clusters/<env>/<cluster>/cluster-secret.yaml).
#    🔑 **플랫폼이 무엇을·어떤 버전으로 승인하고, 팀은 쓸지를 라벨로 옵트인**하는 것이
#       실물에서 뜻하는 바가 이것이다 — **paved road**.
#
#    cluster Secret 에 라벨을 추가하는 것은 O(1) 확장을 해치지 않는다 — 새 클러스터도
#    Secret 1개이고 라벨이 하나 늘 뿐이다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 네임스페이스 = **keda (전용 ns 신설)** — 이 repo의 네임스페이스 기본 규칙.
#    ⛔ addons/baseline/{aws-load-balancer-controller,karpenter}.yaml 의 `kube-system` 을
#       복사해 오지 말 것. 그 둘은 근거를 댄 예외다.
#    ⛔ `managedNamespaceMetadata` 를 쓰지 않는다 — 쓰면 ArgoCD 가 ns 를 소유하게 되고
#       아래 prune:true 와 겹쳐 **addon 제거가 네임스페이스째 지운다**.
#
# 🔴 Terraform 전제: **없다.**
#    AWS 스케일러(SQS·CloudWatch)는 이 addon 에 넣지 않았다
#    ⇒ Pod Identity·IAM 0건 ⇒ **이 addon 이 계층 2 안에서 닫힌다**(모듈 repo .tf 도, 소비 repo apply 도 없다).
#    ⚠️ AWS 스케일러 요구가 생기면 modules/eks-cluster/iam.tf 에 keda/keda-operator association 을
#       연다. **가역적이다** — ALBC·external-dns 와 같은 패턴이라 새로 발명할 것이 없다.
#
# **이미지**: ghcr.io/kedacore/{keda,keda-metrics-apiserver,keda-admission-webhooks}
#    ✅ arm64 확인 완료 — 3개 전부 manifest index 에 linux/arm64(이 클러스터는 Graviton).
#    ⚠️ **egress canary 는 이미지 pull 을 판정할 수 없다** — canary 는 repo-server 의 차트 fetch 만
#       본다. 이미지 pull 은 kubelet→NAT 로 경로가 다르다 — kyverno 와 함께 ghcr.io 첫 사용이다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keda
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # 여기가 baseline 과 갈리는 유일한 지점이다(위 헤더).
          #    라벨이 없는 클러스터는 이 팬아웃에 걸리지 않는다 = 구독하지 않은 것이다.
          matchLabels:
            addon-keda: enabled
  template:
    metadata:
      name: '{{name}}-keda'
      # 이 finalizer가 없으면 Application CR을 지워도 실제 리소스는 클러스터에
      # orphan으로 남는다.
      # (addons/baseline/karpenter.yaml 헤더 참조).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://kedacore.github.io/charts
          chart: keda
          # 핀 근거: index.yaml 전수 78개 중 stable 72개를 semver 정렬한 최신.
          # chart kubeVersion `>=v1.23.0-0` · 클러스터 1.35.6 ⇒ 충족.
          targetRevision: 2.20.2
          helm:
            # 스케줄링 제약 둘만 넘기고 나머지는 차트 기본값이다. 무엇을 넘기고 무엇을 기본값으로
            # 두는지는 values 파일이 갖는다. $values 는 아래 `ref: values` source 의 저장소 루트다.
            valueFiles:
              - $values/addons/keda/values.yaml
        # 값 참조 전용 source — `ref` 만 있고 path/chart 가 없으므로 렌더 대상이 아니다.
        - repoURL: https://github.com/skax-ca/eks-platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: keda
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # 전용 ns 신설 — 자동 생성되는 Namespace 가 AppProject clusterResourceWhitelist 검사를
          # 받는다. {group:"", kind:Namespace} 는 kyverno addon 이 이미 열어 뒀다.
          - CreateNamespace=true
          # CRD 6개 + APIService. ALBC 와 같은 이유로 SSA.
          - ServerSideApply=true
