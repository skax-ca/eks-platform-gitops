# Cluster Autoscaler — ②opt-in 카탈로그 addon (managed_node_groups 오토스케일링)
#
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT — `07-runbooks.md`의
#       「Karpenter + Cluster Autoscaler 동시 운영 — taint 전략」절)
#
# **KEDA 와 같은 카탈로그 패턴** — matchLabels {addon-cluster-autoscaler: enabled} 인 클러스터에만
#    팬아웃한다. Karpenter(baseline, 전 클러스터)와 달리 **선택**이다 — "app 워크로드는 전부
#    Karpenter, 필수 addon·OSS(redis·postgresql·mongodb 등)는 managed_node_groups + CA"를
#    쓰고 싶은 고객만 옵트인한다.
#
# 🔴 Terraform 전제(완비 — skax-ca/iac-module-library PR #25):
#    · Pod Identity role + least-privilege 정책(`enable_cluster_autoscaler = true`)
#    · Pod Identity association **kube-system/cluster-autoscaler** (모듈이 고정, 아래 네임스페이스
#      절 참조 — 가역적이지 않다, 바꾸려면 이 매니페스트와 Terraform 양쪽을 함께 고친다)
#    · scale-from-zero용 ASG `node-template/*` 태그(managed_node_groups의 labels·taints 미러링)
#    · auto-discovery 태그(`k8s.io/cluster-autoscaler/enabled` · `.../{{name}}`)는 **AWS가
#      managed node group 생성 시 자동으로 ASG에 붙인다** — 이 매니페스트도 Terraform 도
#      만들 필요가 없다(실측: `terraform-aws-modules/terraform-aws-eks#1886`).
#
# ✅ **dev 클러스터는 이 addon 을 구독한다**(cluster Secret 라벨, 2026-08-14) —
#    `managed_node_groups.system`에 `workload-class=system` taint 가 `eks-reference-infra`
#    PR #32·#33 으로 이미 반영·실측 검증됐다. taint 분리 없이 CA 를 켜면 CA 가 `system`
#    노드그룹 전체를 auto-discover 해 Karpenter 와 같은 pending pod 를 두고 경쟁할 수 있었는데
#    (근거: `aws/karpenter-provider-aws#2543`), 아래 `nodeSelector`+`tolerations`가 그 경쟁을
#    차단한다.
#
# 네임스페이스 = **kube-system** — 이 repo의 네임스페이스 기본 규칙(전용 ns 신설)의 예외다.
#    ⛔ 아래 카탈로그 addon 을 참고해 만들 때 **이 줄을 복사하지 말 것** — ALBC·Karpenter 와
#    달리 이 예외는 "공식 문서가 요구해서"가 아니다.
#
#    **정직한 근거**: Terraform 쪽 Pod Identity association 이 이미 `kube-system/
#    cluster-autoscaler` 로 고정되어 있다(`enable_cluster_autoscaler` 설계 시 사용자가 관례로
#    선택 — `iac-module-library` `docs/02-choose-your-path.md` 참조, 그 문서도 "공식 근거
#    없음"을 그대로 적어 뒀다). ALBC 의 예외(공식 문서 → association)와 인과가 반대다 —
#    association 을 먼저 kube-system 으로 만든 뒤 이 매니페스트가 거기 맞추는 것이라, 이 이유를
#    "근거 3"(집행 장치)과 같은 층으로 세지 않는다. **지금 바꾸려면 두 저장소(Terraform
#    association + 이 매니페스트)를 함께 고쳐야 한다**는 사실만 정직하게 남긴다.
#
# **chart 실측** — `helm repo add autoscaler https://kubernetes.github.io/autoscaler` 로
#    전수(120개 버전) 조회, appVersion(CA 자체 버전)이 클러스터 k8s 마이너(1.35)와 정확히
#    일치하는 것 중 최신 = 9.59.0(appVersion 1.35.0). cross-version 은 상류가 테스트·지원하지
#    않는다(AWS EKS Best Practices Guide) — k8s 를 올릴 때 이 값도 함께 올린다.
#    chart 에 kubeVersion 제약은 없다(KEDA 와 다름 — 실측: `helm show chart`).
#
# **cluster-scoped 리소스 실측**: `helm template` 로컬 렌더 — ClusterRole 1 · ClusterRoleBinding 1
#    뿐이다(CRD·APIService 없음). 둘 다 `projects/platform.yaml`의 ALBC 항목과 겹친다 ⇒
#    clusterResourceWhitelist 에 **추가할 것이 없다**(Karpenter 와 같은 결론).
#
# ✅ **egress canary 확인됨**(2026-08-14, 사용자 실측) — repo-server 가 `kubernetes.github.io`에
#    여러 차례 정상 접근 확인됨. 옵트인 전제조건 충족.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-autoscaler
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # 여기가 baseline(Karpenter)과 갈리는 유일한 지점이다 — 구독한 클러스터만.
          matchLabels:
            addon-cluster-autoscaler: enabled
  template:
    metadata:
      name: '{{name}}-cluster-autoscaler'
      # 이 finalizer가 없으면 Application CR을 지워도 실제 리소스는 클러스터에
      # orphan으로 남는다 — spoke teardown 리허설(2026-08-21)에서 실측 발견
      # (addons/baseline/karpenter.yaml 헤더 참조).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://kubernetes.github.io/autoscaler
        chart: cluster-autoscaler
        targetRevision: 9.59.0
        helm:
          # Application 이름({{name}}-cluster-autoscaler)과 release 이름을 분리한다 —
          # 이 addon이 DNS-1123 63자 제한에 실제로 걸려 이름이 잘렸던 사례가 이 결정의 근거다.
          # 계약: iac-module-library docs/02-choose-your-path.md
          releaseName: cluster-autoscaler
          parameters:
            # autoDiscovery.tags 기본값이 이미
            #   k8s.io/cluster-autoscaler/enabled · k8s.io/cluster-autoscaler/{{clusterName}}
            # 이고, 이 두 태그는 AWS 가 managed node group 생성 시 ASG 에 자동으로 붙인다 —
            # 그래서 autoDiscovery.clusterName 하나만 주면 된다(values 오버라이드 불필요).
            - name: autoDiscovery.clusterName
              value: '{{name}}'
            - name: awsRegion
              value: ap-northeast-2
            - name: cloudProvider
              value: aws
          values: |
            # Pod Identity 바인딩 대상(kube-system/cluster-autoscaler). IRSA 애노테이션 불필요.
            # ⚠️ 이 chart 는 ALBC·Karpenter 와 달리 serviceAccount 가 최상위가 아니라 rbac 아래다
            #    (실측: `helm show values`) — 그대로 복사하면 조용히 무시된다.
            rbac:
              serviceAccount:
                create: true
                name: cluster-autoscaler

            # 자기 자신이 관리하는(=Karpenter 가 만든) 노드에는 못 뜨게 막는다. Karpenter 차트는
            # 이 보호가 기본값으로 내장돼 있지만(`karpenter.sh/nodepool DoesNotExist`,
            # eks-reference-infra 의 system 노드그룹 주석 참조) CA 차트는 affinity 기본값이
            # 비어 있다(실측) — 그래서 이 매니페스트가 명시로 채운다.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: karpenter.sh/nodepool
                          operator: DoesNotExist

            # system 노드그룹으로 끌어당기고(nodeSelector) taint 를 통과한다(tolerations) —
            # 모듈 repo `docs/07-runbooks.md`의 「Karpenter + Cluster Autoscaler 동시 운영 —
            # taint 전략」절과 같은 형태(coredns·metrics-server 와 동일 패턴). 위 negative
            # affinity 는 "Karpenter 노드는 안 됨"만 막고 "system 노드로 가라"는 강제하지
            # 않으므로 nodeSelector 가 따로 필요하다. 차트 기본값은 둘 다 비어 있다(실측:
            # `helm show values`).
            nodeSelector:
              workload-class: system
            tolerations:
              - key: workload-class
                operator: Equal
                value: system
                effect: NoSchedule
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
