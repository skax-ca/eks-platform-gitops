# AWS Load Balancer Controller — wave 1(컨트롤러).
#
# wave 1 인 이유: Gateway API CRD(wave 0)를 기다리고, 자기 CR(gateway, wave 2)보다 먼저 서고 늦게
#    지워진다. gateway 의 finalizer 를 이 컨트롤러가 처리하므로, 해제 때 먼저 사라지면 frontend·backend
#    SG 2개가 고아로 남아 VPC destroy 를 막는다.
# helm 인 이유는 EKS community addon 에 ALBC 가 없어서다. 다른 경로가 없다.
# 네임스페이스가 kube-system 인 근거는 README 「addon 네임스페이스 규칙」이 갖는다. 새 addon에
#    이 값을 복사하지 않는다. 전용 ns 신설이 기본 규칙이고 이 파일은 예외다.
# 🔑 AWS 전용 Gateway CRD(TargetGroupConfiguration 등)는 이 차트의 `crds/` 폴더가 이미 설치한다.
#    별도 addon 이 필요한 것은 표준 CRD(gateway.networking.k8s.io)뿐이고 gateway-api-crds.yaml 소관이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "platform.name" . }}-aws-lbc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      # 트래픽을 받는 ALB 를 직접 움직이므로 비운영에서 먼저 확인하고 승격한다.
      targetRevision: {{ include "platform.staged" (list . "awsLoadBalancerController") }}
      helm:
        releaseName: aws-lbc
        parameters:
          - name: clusterName
            value: {{ include "platform.name" . }}
          # vpcId 가 아니라 태그로 찾는다. 노드 IMDSv2 hop limit=1 이라 파드에서 VPC 자동 탐지가 안
          #    되고(ec2imds context deadline exceeded 로 CrashLoop), AWS 발급 ID 는 재구축마다 바뀌는
          #    반면 Name 태그는 네이밍 규칙이 고정한다.
          #    ⛔ hop limit 을 2로 올리는 우회는 기각됐다. 그 노드의 모든 파드가 노드 IAM role 을
          #       탈취할 수 있게 돼 Pod Identity 격리가 클러스터 전체에서 무너진다.
          #    ⚠️ 이 값이 틀려도 ArgoCD 는 Synced/Healthy 다. helm 값이라 실패가 런타임으로 밀린다.
          #    ⚠️ 태그를 여러 개 주면 AND 필터다. Name 하나로 유일성이 성립한다.
          - name: vpcTags.Name
            value: {{ required "cluster.vpcName 이 비었다(cluster Secret vpcName 라벨)" .Values.cluster.vpcName }}
        valueFiles:
          - $values/addons/aws-load-balancer-controller/values.yaml
    - repoURL: {{ .Values.gitops.repoURL }}
      targetRevision: {{ .Values.gitops.targetRevision }}
      ref: values
  destination:
    server: {{ include "platform.server" . }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRD 가 커서 client-side apply 의 애노테이션 크기 한도에 걸린다.
      - ServerSideApply=true
