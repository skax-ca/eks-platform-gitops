# Karpenter 컨트롤러 — wave 1(컨트롤러). CR(NodePool/EC2NodeClass)은 karpenter-nodepool.yaml.
#
# wave 1 인 이유: 자기 CRD 를 차트에 동봉하고, 자기 CR(wave 2)보다 먼저 서고 늦게 지워진다. CR 의
#    finalizer 를 이 컨트롤러가 처리하므로, 해제 때 먼저 사라지면 EC2NodeClass 가 멈추고 떠 있던
#    Karpenter 노드가 회수되지 않을 수 있다.
# 네임스페이스가 kube-system 인 근거는 README 「addon 네임스페이스 규칙」이 갖는다. 새 addon에
#    이 값을 복사하지 않는다. 전용 ns 신설이 기본 규칙이고 이 파일은 예외다.
# Terraform 전제: 컨트롤러·노드 IAM role, 중단 SQS `Karpenter-<cluster>`, Pod Identity
#    association `kube-system/karpenter`, 노드 SG의 `karpenter.sh/discovery` 태그.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "platform.name" . }}-karpenter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    # OCI registry 다. Repository Secret 도 enableOCI 설정도 필요 없다. scheme 없는 repoURL 만으로
    # pull 된다.
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      # 노드를 직접 만드는 컨트롤러라 비운영에서 먼저 확인하고 승격한다.
      targetRevision: {{ include "platform.staged" (list . "karpenter") }}
      helm:
        releaseName: karpenter
        parameters:
          # 없으면 helm template 이 실패한다. ⚠️ 그 실패는 rendered 0 + ComparisonError 라 egress
          # 실패와 똑같이 보인다. revision 이 해석됐으면 egress 가 아니라 값 문제다.
          - name: settings.clusterName
            value: {{ include "platform.name" . }}
          # SQS 이름이 클러스터명에서 파생되므로 라벨을 새로 만들지 않는다.
          - name: settings.interruptionQueue
            value: Karpenter-{{ include "platform.name" . }}
        valueFiles:
          - $values/addons/karpenter/values.yaml
    - repoURL: {{ .Values.gitops.repoURL }}
      targetRevision: {{ .Values.gitops.targetRevision }}
      ref: values
  destination:
    server: {{ include "platform.server" . }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
