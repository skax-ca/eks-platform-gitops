# Kyverno 엔진 — wave 1(컨트롤러). 정책은 kyverno-policies.yaml(업스트림 PSS)과
# kyverno-custom-policies.yaml(우리 소유)이 갖는다.
#
# wave 1 인 이유: 정책(wave 2)의 CRD 를 이 차트가 만들고, 정책보다 먼저 서야 정책 Application 이
#    `service ...-kyverno-svc not found` 비교 오류를 캐시하지 않는다.
# ⚠️ 시스템 노드그룹 taint 를 넘는 toleration(addons/kyverno/values.yaml)이 있어 NodePool 이
#    지워진(wave 2) 뒤에도 삭제 훅이 시스템 노드에서 돈다. 이 toleration 을 빼면 이 Application 은
#    karpenter-nodepool 보다 뒤 wave 로 가야 한다(azure 쪽 배치가 그 경우다).
# baseline 인 이유: 옵트인으로 두면 라벨을 빠뜨린 클러스터가 정책 엔진 없이 뜬다.
# 🔑 엔진은 admission webhook 컨트롤러이기도 해서, 깨지면 그 클러스터의 모든 배포가 막힌다. 그래서
#    비운영에서 먼저 확인하고 승격한다. 엔진과 정책의 버전 짝 규칙은 values.yaml 의 versions 표가 갖는다.
# ⚠️ 이미지가 reg.kyverno.io(GHCR 앞 vanity 도메인)라 노드가 reg.kyverno.io 와 ghcr.io 둘 다
#    나가야 한다. 다른 addon 은 전부 public.ecr.aws 라 여기만 경로가 다르다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "platform.name" . }}-kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- include "platform.meta" (list . "kyverno" "1") | nindent 2 }}
    # 이것이 없으면 CRD 11개가 영구 OutOfSync 다. 차이 나는 `spec.conversion` 은 apiserver 가 채운
    #    무소유 필드라 managedFields 기반 ignoreDifferences 로는 잡히지 않는다.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: {{ include "platform.staged" (list . "kyverno") }}
      helm:
        valueFiles:
          - $values/addons/kyverno/values.yaml
    - repoURL: {{ .Values.gitops.repoURL }}
      targetRevision: {{ .Values.gitops.targetRevision }}
      ref: values
  destination:
    server: {{ include "platform.server" . }}
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ⚠️ 자동 생성된 Namespace 도 AppProject 의 clusterResourceWhitelist 검사를 받는다.
      #    ns 가 이미 있으면 검사 자체가 없어 두 번째 클러스터에서만 깨진다.
      #    ⛔ managedNamespaceMetadata 는 쓰지 않는다. ArgoCD 가 ns 를 소유하게 되고, 아래
      #       prune: true 와 겹치면 addon 제거가 네임스페이스째 지운다.
      - CreateNamespace=true
      # CRD 22개가 커서 client-side apply 의 애노테이션 크기 한도에 걸린다.
      - ServerSideApply=true
