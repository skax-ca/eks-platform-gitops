# AWS Load Balancer Controller — wave 1(컨트롤러).
#
# wave 1 인 이유: Gateway API CRD(wave 0)를 기다리고, 자기 CR(gateway, wave 2)보다 먼저 서고 늦게
#    지워진다. gateway 의 finalizer 를 이 컨트롤러가 처리하므로, 해제 때 먼저 사라지면 frontend·backend
#    SG 2개가 고아로 남아 VPC destroy 를 막는다.
# helm 인 이유는 EKS community addon 에 ALBC 가 없어서다. 다른 경로가 없다.
# 네임스페이스가 kube-system 인 근거는 README 「addon 네임스페이스 규칙」이 갖는다. 새 addon에
#    이 값을 복사하지 않는다. 전용 ns 신설이 기본 규칙이고 이 파일은 예외다.
# 🔑 AWS 전용 Gateway CRD(TargetGroupConfiguration 등)는 이 차트의 `crds/` 폴더가 이미 설치한다.
#    별도 addon 이 필요한 것은 표준 CRD(gateway.networking.k8s.io)뿐이고 gateway-api-crds.yaml 소관이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "cluster-addons.name" . }}-aws-lbc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- include "cluster-addons.meta" (list . "aws-lbc" "1") | nindent 2 }}
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      # 트래픽을 받는 ALB 를 직접 움직이므로 비운영에서 먼저 확인하고 승격한다.
      targetRevision: {{ include "cluster-addons.staged" (list . "awsLoadBalancerController") }}
      helm:
        releaseName: aws-lbc
        parameters:
          - name: clusterName
            value: {{ include "cluster-addons.name" . }}
          # vpcId 가 아니라 태그로 찾는다. 노드 IMDSv2 hop limit=1 이라 파드에서 VPC 자동 탐지가 안
          #    되고(ec2imds context deadline exceeded 로 CrashLoop), AWS 발급 ID 는 재구축마다 바뀌는
          #    반면 Name 태그는 네이밍 규칙이 고정한다.
          #    ⛔ hop limit 을 2로 올리는 우회는 기각됐다. 그 노드의 모든 파드가 노드 IAM role 을
          #       탈취할 수 있게 돼 Pod Identity 격리가 클러스터 전체에서 무너진다.
          #    ⚠️ 이 값이 틀려도 ArgoCD 는 Synced/Healthy 다. helm 값이라 실패가 런타임으로 밀린다.
          #    ⚠️ 태그를 여러 개 주면 AND 필터다. Name 하나로 유일성이 성립한다.
          - name: vpcTags.Name
            value: {{ required "cluster.vpcName 이 비었다(cluster Secret vpcName 라벨)" .Values.cluster.vpcName }}
          # 웹훅 TLS 를 cert-manager 에 맡길지. 티어로 승격하는 스위치다(values.yaml 의 awsLbcCertManager).
          #    켜면 차트가 Secret 을 렌더하지 않고 Certificate·Issuer 를 만들며, 웹훅의 caBundle 은
          #    cert-manager 의 cainjector 가 넣는다. 아래 ignoreDifferences 의 caBundle 항목이 그 값을 지킨다.
          - name: enableCertManager
            value: {{ include "cluster-addons.staged" (list . "awsLbcCertManager") | quote }}
        valueFiles:
          - $values/addons/aws-load-balancer-controller/values.yaml
    - repoURL: {{ .Values.gitops.repoURL }}
      targetRevision: {{ .Values.gitops.targetRevision }}
      ref: values
  destination:
    server: {{ include "cluster-addons.server" . }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRD 가 커서 client-side apply 의 애노테이션 크기 한도에 걸린다.
      - ServerSideApply=true
      # 아래 ignoreDifferences 와 짝이다. 이것이 없으면 diff 만 숨고 sync 는 여전히 덮어쓴다.
      - RespectIgnoreDifferences=true
  # 🔑 웹훅 TLS 는 처음 만들어진 것을 그대로 둔다. 차트가 렌더할 때마다 CA 와 인증서를 새로
  #    만들어(genCA), 이것이 없으면 Argo CD 가 렌더가 바뀔 때마다 Secret 과 웹훅 caBundle 을 다시
  #    쓴다. 파드가 새 Secret 을 읽기 전까지 caBundle 과 파드 인증서가 어긋나고, 그동안 이 웹훅을
  #    거치는 요청이 `x509: certificate signed by unknown authority` 로 거부된다. mservice 웹훅이
  #    전 네임스페이스의 Service 를 받으므로 같은 클러스터의 다른 addon sync 가 함께 멈춘다.
  #    차트의 keepTLSSecret 은 helm lookup 에 기대는데 Argo CD 의 렌더에는 클러스터가 없어 듣지 않는다.
  # ⚠️ RespectIgnoreDifferences 는 이미 있는 리소스에만 걸린다. 최초 생성 때는 렌더 값이 그대로
  #    들어가고, Secret 과 웹훅 둘이 같은 렌더에서 나와야 짝이 맞는다. 어긋난 채 굳으면 Secret 과
  #    웹훅 설정 둘을 함께 지워 다시 만들게 한다(README 「운영 노트」).
  # ⚠️ 인증서 유효 기간은 차트가 정한 3650일이고 갱신하는 것이 없다. 클러스터를 그보다 오래 두면
  #    위와 같은 방법으로 다시 만든다.
  # ⚠️ 차트가 웹훅 설정을 늘리면(kind 나 이름이 바뀌면) 이 목록도 따라 늘린다. 빠진 쪽은 caBundle 만
  #    새 렌더 값으로 바뀌어 그 웹훅이 계속 거부한다.
  ignoreDifferences:
    - kind: Secret
      name: aws-load-balancer-tls
      namespace: kube-system
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
