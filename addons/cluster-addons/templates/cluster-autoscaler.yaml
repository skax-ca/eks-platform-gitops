# Cluster Autoscaler — wave 1(컨트롤러). managed_node_groups 를 스케일한다.
#
# 전 클러스터가 받는다. system 노드그룹이 이 패턴의 모든 클러스터에 있고, 그 노드그룹을 늘리고 줄이는
#    것이 이 컨트롤러다. "app 워크로드는 Karpenter, 필수 addon·OSS 는 managed_node_groups + CA" 다.
# 버전은 티어로 갈린다(staged). 이미지의 마이너가 클러스터의 k8s 마이너를 따라가야 하는데, 클러스터
#    업그레이드가 nonprd 를 먼저 올리므로 한 줄로는 그 구간을 적을 수 없다.
# ⚠️ taint 분리 없이 켜면 CA 가 노드그룹을 auto-discover 해 Karpenter 와 같은 pending pod 를 두고
#    경쟁한다. addons/cluster-autoscaler/values.yaml 의 nodeSelector·tolerations 가 그 경쟁을 차단한다.
# 네임스페이스가 kube-system 인 근거는 README 「addon 네임스페이스 규칙」이 갖는다. ⚠️ 그 표에서
#    유일하게 약한 예외다. 바꾸려면 Terraform 의 Pod Identity association 과 함께 고쳐야 한다.
# ⛔ Terraform 전제: Pod Identity role·association `kube-system/cluster-autoscaler`, ASG 의
#    scale-from-zero `node-template/*` 태그(eks-cluster 모듈의 enable_cluster_autoscaler). 없으면 권한
#    없이 떠서 조용히 아무것도 못 한다. 클러스터를 등록하기 전에 그 값을 켠다.
# taint 병행 전략: skax-ca/eks-reference-infra의 docs/runbooks.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "cluster-addons.name" . }}-cluster-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- include "cluster-addons.meta" (list . "cluster-autoscaler" "1") | nindent 2 }}
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: cluster-autoscaler
      targetRevision: {{ include "cluster-addons.staged" (list . "clusterAutoscaler") }}
      helm:
        releaseName: cluster-autoscaler
        parameters:
          # 이미지의 마이너를 그 티어 클러스터의 k8s 마이너에 맞춘다. 차트 기본값은 차트 appVersion 이다.
          - name: image.tag
            value: {{ include "cluster-addons.staged" (list . "clusterAutoscalerImage") }}
          # autoDiscovery.tags 기본값이 AWS 가 managed node group 에 자동으로 붙이는 두 태그와
          # 같아서 clusterName 하나만 주면 된다.
          - name: autoDiscovery.clusterName
            value: {{ include "cluster-addons.name" . }}
          - name: awsRegion
            value: ap-northeast-2
          - name: cloudProvider
            value: aws
        valueFiles:
          - $values/addons/cluster-autoscaler/values.yaml
    - repoURL: {{ .Values.gitops.repoURL }}
      targetRevision: {{ .Values.gitops.targetRevision }}
      ref: values
  destination:
    server: {{ include "cluster-addons.server" . }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
