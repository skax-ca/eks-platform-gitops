# Kyverno PSS 정책 — ①baseline addon (업스트림 kyverno-policies 차트, ClusterPolicy 11개)
#
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT)
#
# **Kyverno 파일 3개 중 ②다** — ① 엔진은 `kyverno.yaml`, ③ 커스텀 정책은
#    `kyverno-custom-policies.yaml`. 파일이 나뉜 이유와 승격 순서는 `kyverno.yaml` 헤더가 갖는다.
#
# ⛔ **엔진(①)과 같은 마이너 라인을 유지한다.** 차트 번호 일치가 아니다. 이 차트가 요구하는
#    것은 엔진 app 버전의 **하한**이고(차트 README: PSS 정책은 Kyverno 1.6.0 이상), 라인이
#    갈리면 정책 내용이 전제한 app 버전과 어긋난다.
#    ⇒ 정책 **내용**만 보면 uniform 이 맞지만, 엔진이 staged 라 이것도 따라간다. 티어 **안에서는**
#      엔진과 정책이 항상 같은 라인이고, 차이는 승격 구간에만 있다.
#    ⚠️ 라인 안에서 엔진만 앞서는 것은 정상이다. 이 차트는 그 라인 최신 패치에 두면 된다
#       (엔진 단독 릴리스 8건의 근거는 kyverno.yaml 헤더가 갖는다).
#
# 🔴 Terraform 전제: **없다.** ①과 같다.
#
# ────────────────────────────────────────────────────────────────────────────
# ②-prd PSS 정책 — staged 전파의 prd 티어
# ────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # ⚠️ 돌고 있는 클러스터가 있을 때 이 이름을 바꾸지 않는다(karpenter.yaml 헤더 참조).
  name: kyverno-policies-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          # staged 전파 — prd 티어.
          # 🔑 정책 **내용**만 보면 uniform 이 맞다(클러스터 간 차이가 곧 통과 기준의 차이다).
          #    그런데 이 차트는 엔진과 **같은 마이너 라인**이어야 한다 ⇒ 엔진이 staged 면 이것도
          #    따라가야 짝이 유지된다. 티어 안에서는 항상 같은 라인이고, 차이는 승격 구간에만 있다.
          #    ⛔ ③(우리가 만든 정책)은 이 제약이 없어 uniform 으로 남는다.
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-kyverno-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        # 🔴 ClusterPolicy 11개도 `ServerSideDiff` 없이는 영구 `OutOfSync` 다 — ①의 CRD 와
        #    **같은 원인**이다. 진짜 차이는 **`spec.admission`·`spec.emitWarning`** 이고,
        #    Kyverno CRD openAPI 스키마의 `default:`를 apiserver 가 채운 것이다(`kyverno` 매니저는
        #    `status` 서브리소스만 소유하므로 이 필드들의 소유자가 아니다).
        #    ✅ 확인: 그 둘을 뺀 desired 로 SSA dry-run → predicted == live **IDENTICAL**.
        #    ⚠️ 차트가 기본값을 늘리면 `ignoreDifferences` 였다면 그때마다 다시 열거해야 했다 —
        #       ServerSideDiff 는 원인 자체를 다루므로 목록을 늘릴 일이 없다.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno-policies
        # ⚠️ 컨트롤러와 **같은 마이너 라인**을 유지한다. 이 라인(3.8)은 양쪽에 같은 번호가 있다.
        # 🔴 **3.9 로 올리면 이 차트가 렌더하는 kind 가 바뀐다** (`policyType` 기본값이
        #    `ClusterPolicy` ⇒ `ValidatingPolicy`). 근거와 선택지는 `kyverno.yaml` 의 핀 주석이
        #    갖는다. 이 값만 먼저 올리지 않는다.
        targetRevision: 3.8.2
        helm:
          parameters:
            # ─────────────────────────────────────────────────────────────
            # 🔴 **failurePolicy 는 chart 기본 Fail 에서 Ignore 로 바꾼 유일한 값이다.**
            #
            #    validationFailureAction 과 **이름이 비슷하지만 완전히 다른 축**이다:
            #       · validationFailureAction = **정책을 위반했을 때** 무엇을 하는가 → Audit(차트 기본, 유지)
            #       · failurePolicy           = **웹훅에 닿지 못할 때** 무엇을 하는가 → Fail(차트 기본)
            #
            #    **Audit + Fail 은 비정합이다.** 아무것도 막지 않기로 결정해 놓고,
            #    Kyverno 가 죽으면 **전부 막는다** — 얻는 것 없이 가용성만 깎는다.
            #
            #    background:true(차트 기본)라 잃는 것이 거의 없다 — 웹훅을 놓쳐도
            #       **백그라운드 스캔이 PolicyReport 를 만든다.** 잃는 것은 *실시간성* 뿐이다.
            #
            #    ⚠️ **Enforce 로 전환할 때 Fail 로 함께 올린다.** 두 값은 **짝으로 움직인다** —
            #       한쪽만 바꾸면 다시 비정합이 된다. 그리고 그때 위 argocd ns 질문을 먼저 답한다.
            # ─────────────────────────────────────────────────────────────
            - name: failurePolicy
              value: Ignore
        # ⛔ validationFailureAction 을 적지 않는다 — **Audit 이 차트 기본값이다**(차트 values.yaml 확인).
        #    기본값을 옮겨 적으면 차트를 올릴 때 그 줄이 조용히 낡는다(argocd-values.yaml 과 같은 규율).
        # ⛔ podSecurityStandard 도 적지 않는다 — 기본이 `baseline` 이고 그것이 우리가 원하는 값이다.
      destination:
        server: '{{server}}'
        # ClusterPolicy 는 cluster-scoped 라 이 ns 는 형식상 값이다(Karpenter CR 과 같다).
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # ①이 CRD 를 막 만든 직후의 첫 sync 에서 dry-run 이 실패하는 것을 피한다.
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
---
# ────────────────────────────────────────────────────────────────────────────
# ②-nonprd PSS 정책 — staged 전파의 nonprd 티어
#
# ⛔ **②-prd 와 함께 고친다.** failurePolicy 근거와 적지 않기로 한 값들(validationFailureAction·
#    podSecurityStandard)은 위 ②-prd 블록이 소유한다. 값이 갈려야 하는 것은 `targetRevision` 뿐이다.
# ⛔ **①-nonprd 와 같은 마이너 라인을 유지한다.**
# ────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-kyverno-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno-policies
        # ①-nonprd 와 같은 마이너 라인. 승격 대기 중에는 prd 보다 앞선다.
        targetRevision: 3.8.2
        helm:
          parameters:
            # Audit + Fail 비정합을 피한다 — 근거 전문은 ②-prd 블록.
            - name: failurePolicy
              value: Ignore
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
