# Gateway API 표준 CRD — ①baseline addon (전 클러스터)
#
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT)
#
# 🔑 컨트롤러가 아니라 **CRD만** 설치하는 addon이다. 실제 트래픽을 만드는 컨트롤러는 이미 있는
#    `aws-load-balancer-controller.yaml`(chart 3.5.0 = appVersion v3.5.0)이 — GA 요구 최소버전
#    v2.13.0을 이미 넘겨서 — 그대로 담당한다. Terraform 쪽(IAM·모듈 버전)도 변경이 없다:
#    `terraform-aws-modules/eks-pod-identity` v2.8.2가 붙이는 ALBC 정책에 GA 시대 액션
#    (DescribeCapacityReservation 등)이 이미 포함돼 있다(GitHub 소스 실측 확인).
#    ⇒ 새로 추가할 것은 이 파일 하나뿐이다.
#
# ⛔ AWS 전용 Gateway CRD(TargetGroupConfiguration·LoadBalancerConfiguration·
#    ListenerRuleConfiguration)를 위한 별도 addon은 **만들지 않는다** — 이미
#    `aws-load-balancer-controller.yaml`이 쓰는 chart 자신의 `crds/` 폴더에 그 3개가 들어있고,
#    ArgoCD는 `skipCrds`를 켜지 않는 한 기본적으로 `helm template --include-crds`로 렌더하므로
#    이미 설치돼 있다(`helm template aws-lbc eks-charts/aws-load-balancer-controller --version
#    3.5.0 --include-crds`로 로컬 렌더해 3개 CRD가 출력에 포함됨을 실측 확인). 별도 Application을
#    또 만들면 같은 CRD를 두 Application이 동시에 소유하려는 충돌이 난다 — 이 저장소가 이미 아는
#    표준 Gateway API CRD(gateway.networking.k8s.io 그룹)만 이 파일이 담당하는 이유다.
#
# ⚠️ 이 CRD가 있어도 아무 AWS 리소스도 생기지 않는다 — Gateway API 타입을 apiserver에
#    등록할 뿐이다. 실제 ALB를 만드는 것은 `Gateway` 리소스이고, 그 트리거가 되는
#    `GatewayClass`(gateway.k8s.aws/alb)는 별도 baseline addon `gateway.yaml`이 만든다 —
#    레퍼런스 아키텍처로서 GatewayClass·Gateway까지 실사용 계층을 보여주기로 했다(HTTPRoute·
#    백엔드는 여전히 계층 3, 이 저장소 범위 밖).
#
# 소스가 helm repo가 아니라 **git repo(디렉토리)**인 이유: upstream(kubernetes-sigs/gateway-api)이
#    이 CRD 세트를 helm chart로 배포하지 않는다(GitHub Release 첨부 YAML만 제공) — 그 YAML이
#    그대로 git 태그 경로(config/crd/standard)에도 있어 ArgoCD Directory 소스로 바로 쓸 수 있다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  generators:
    # 다른 baseline addon과 동일한 cluster generator — 근거는 aws-load-balancer-controller.yaml 헤더 참조.
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: '{{name}}-gateway-api-crds'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/kubernetes-sigs/gateway-api.git
        # 실측 핀 — GitHub Releases 중 prerelease가 아닌 최신 stable. 다음에 올릴 때는
        # releases API로 다시 확인한다(기존 핀 값을 여기 남기지 않는다 — git이 이력을 갖는다).
        targetRevision: v1.6.2
        # kustomization.yaml이 없는 순수 YAML 11개 디렉토리라 ArgoCD가 Directory 타입으로 렌더한다.
        path: config/crd/standard
      destination:
        server: '{{server}}'
        # CRD는 cluster-scoped라 이 ns는 형식상 값이다(Karpenter NodePool 앱과 같은 이유).
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # CRD 크기가 client-side apply 애노테이션 한도를 넘는다 — ALBC CRD와 같은 이유.
          - ServerSideApply=true
