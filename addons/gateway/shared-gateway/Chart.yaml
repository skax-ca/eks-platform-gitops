apiVersion: v2
name: shared-gateway
description: |
  GatewayClass · Gateway · LoadBalancerConfiguration — 계층 2가 소유하는 Gateway API 인프라 CR.
  HTTPRoute·백엔드 라우팅 규칙은 계층 3이라 이 저장소 범위 밖이다.

  ⚠️ 평문이 아니라 helm 차트인 이유는 per-cluster 값을 CR 에 주입할 다른 수단이 없어서다.
     ApplicationSet 의 fasttemplate 은 Application spec 에만 적용되고 git 경로 안의 파일에는
     적용되지 않는다.
type: application
version: 0.1.0
