# GatewayClass는 cluster-scoped라 클러스터마다 독립된 객체다 — ApplicationSet이 클러스터별로
# 하나씩 만드는 게 맞다(ALBC도 클러스터마다 독립 배포이므로 대칭이다).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: alb
spec:
  # ALBC가 시작 시 자기 자신을 이 이름으로 등록해둔다(공식 상수). 다른 구현체로 바꾸는 경우
  # 이 한 줄만 바뀌고 Gateway·HTTPRoute는 구현체 무관 표준이라 그대로 간다.
  controllerName: gateway.k8s.aws/alb
