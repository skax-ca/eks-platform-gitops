# ⚠️ 기본값이 없다. 부모 차트가 cluster Secret 값을 주입한다
#    (addons/platform/templates/gateway.yaml). 비어 있으면 템플릿이 required 로 실패한다 — 조용히
#    틀린 값이 들어가는 것보다 낫다. clusterName은 여기서 받지 않는다 — 이 3개 매니페스트
#    (GatewayClass·LoadBalancerConfiguration·Gateway) 중 실제로 참조하는 곳이 없다.
environment: ""

# 내부 전용. internal-elb 태그가 붙은 isolated 서브넷으로 자동 탐색된다 — 클러스터 API
# 엔드포인트·workbench 접근이 전부 private 인 것과 같은 기조다. 외부 노출이 필요하면 이 값을
# internet-facing 으로 바꾼다. 그러면 탐색이 public 서브넷으로 넘어간다(서브넷 ID 를 직접 쓰지 않는다).
scheme: internal

# ⚠️ 빈 배열과 nil 은 뜻이 다르다. 필드를 안 쓰면 ALBC 가 0.0.0.0/0·::/0 으로 열지만, 빈 배열을
#    명시하면 그 기본값을 덮어써 인바운드 규칙이 0개가 된다(SG 는 만들어지되 아무도 못 들어온다).
#    호출자가 정해지기 전까지 CIDR 을 추측해서 미리 열어두지 않는다. 앱팀이 필요해지면 이 배열에
#    CIDR 을 더하는 변경 하나로 끝나고 Gateway·GatewayClass 구조는 그대로다.
sourceRanges: []
