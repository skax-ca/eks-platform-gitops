# Kyverno 엔진 차트 values — kyverno-prd·kyverno-nonprd 두 ApplicationSet 이 같은 파일을 읽는다
#
# 차트 기본값을 그대로 받고 스케줄 전제 하나만 넘긴다. 기본값과 다른 것만 적는다.

# ⚠️ tolerations 하나만 넘긴다. 이 값은 **스케줄 전제**라, 기능적 기본값은 차트 것을 그대로
#    받는다는 결정 안에 있다. system 관리형 노드그룹의 workload-class=system NoSchedule taint
#    때문에 컨트롤러 4종(admission·background·cleanup·reports)이 전부 Pending 이 된다.
#    차트의 top-level global.tolerations 가 4종 전부에 전파된다.
global:
  tolerations:
    - key: workload-class
      operator: Equal
      value: system
      effect: NoSchedule

# 기본값을 유지하는 것 — 판단의 기록:
#  · 컨트롤러 4종 replicas 미지정 = 1. dev 2노드에 충분하다. ⚠️ podAntiAffinity 가 걸려
#    있으므로 **HA 로 올릴 때 노드 수를 함께 본다.**
#  · config.webhooks.namespaceSelector 가 kube-system·kyverno 를 **이미 제외**한다.
#    ⇒ ALBC·Karpenter 는 Kyverno 웹훅 경로에 **아예 들어가지 않는다.**
#    🔴 그러나 **argocd 는 제외 대상이 아니다.** 지금(Audit + failurePolicy Ignore)은 무해하지만
#       Enforce 로 전환하면 **순환 의존**이 된다 — Kyverno 장애 → ArgoCD 막힘 → Kyverno 를
#       고칠 수단 상실. ⇒ Enforce 전환은 그 질문을 **먼저** 답한다.
#       ⛔ 지금 미리 넣지 않는다 — 현재 조합에서 아무 일도 하지 않는 **죽은 설정**이 된다.
#  · config.resourceFilters 도 kube-system·kube-public·kube-node-lease·kyverno 를 제외한다.
