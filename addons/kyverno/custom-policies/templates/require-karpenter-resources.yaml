{{- /* +argocd:skip-file-rendering — root-app 스캔 제외. 렌더 출력에는 남지 않는다 */ -}}
# 설계: skax-ca/iac-module-library의 docs/ (소비 경로 규약 SSOT)
#
# 이 정책은 kyverno-policies(업스트림 PSS baseline)와 별개다 — 그 Application의 source는
#    upstream chart(kyverno-policies) 하나로 고정돼 있어 임의의 새 정책을 주입할 수 없다.
#    그래서 이 저장소가 직접 소유하는 정책은 형제 ApplicationSet(kyverno-custom-policies)으로
#    따로 둔다.
#
# 🔴 **클러스터마다 값이 갈리지 않는데도 helm 차트로 만들었다 — Karpenter NodePool과 이유가
#    다르다.** 처음엔 plain 매니페스트(디렉토리 소스)로 만들었다가 사고를 냈다: 마커는
#    "root-app만 빼라"가 아니라 "Directory 타입으로 이 파일을 읽는 모든 Application에서
#    빼라"는 뜻이라, kyverno-custom-policies Application 자신도 Directory 타입으로
#    잡히면서 자기 담당 파일을 스스로 걸러버렸다(적용 리소스 0개인 채로 Synced/Healthy로
#    보이는 조용한 실패, 2026-08-18 실제 발견). Chart.yaml을 두면 이 Application이
#    **Helm 타입**으로 인식돼 marker 텍스트를 그냥 주석으로 무시하고 정상 렌더링하고,
#    root-app의 최상위 Directory 스캔만 여전히 마커로 걸러진다 — Karpenter NodePool이
#    쓰는 것과 같은 트릭이지만 여기서는 "값 주입"이 아니라 "타입 회피"가 목적이다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-karpenter-resources
  annotations:
    policies.kyverno.io/title: Require CPU/Memory Requests and Memory Limit
    policies.kyverno.io/category: Platform
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Karpenter는 파드의 spec.containers[*].resources.requests를 기준으로 바인패킹·
      노드 크기·스케일링을 계산한다. requests가 없으면 그 계산이 틀어지고,
      memory limit이 없으면 파드 하나가 노드 메모리를 무제한으로 잠식해 다른 파드를
      OOM으로 몰아낼 수 있다. 그래서 requests(cpu·memory)와 memory limit을 필수로
      요구한다.
      ⚠️ cpu limit은 의도적으로 요구하지 않는다 — CPU는 압축 가능한 자원이라 limit을
      걸면 스로틀링으로 지연시간이 튀는 문제가 있다. 이는 업스트림 Kyverno best-practice
      정책(require-requests-limits, kyverno.io/policies/best-practices)과 AWS EKS
      Best Practices Guide가 공통으로 권고하는 방향이다.
spec:
  # ⚠️ Enforce다 — Audit으로 먼저 관찰하지 않고 바로 차단한다(2026-08-18 결정).
  #    failurePolicy는 값을 적지 않는다 — ClusterPolicy 기본값이 Fail이고,
  #    Enforce와 Fail이 짝이 맞는 조합이다(addons/baseline/kyverno.yaml의
  #    kyverno-policies가 Audit+Ignore로 짝을 맞춘 것과 반대 방향으로 같은 원칙).
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-memory-requests-and-memory-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          # ArgoCD 자기 자신은 제외한다. 실측(2026-08-18, helm show values argo/argo-cd
          # --version 10.3.0): 모든 컴포넌트가 resources: {} (기본값 미설정)이고
          # bootstrap/argocd-values.yaml도 그 값을 채우지 않았다 — 지금 켜면 ArgoCD
          # 자신의 재배포가 이 정책에 막힌다(Kyverno 장애 → ArgoCD 막힘 → 고칠 수단
          # 상실과 같은 계열의 순환 의존 위험).
          # kube-system·kyverno·kube-public·kube-node-lease는 Kyverno 기본
          # config.resourceFilters가 이미 모든 정책에서 제외한다 — 여기 따로 적지 않는다.
          - resources:
              namespaces:
                - argocd
      validate:
        message: >-
          Karpenter가 올바르게 스케줄링하려면 모든 컨테이너에 CPU/메모리 requests와
          메모리 limit이 필요하다(cpu limit은 의도적으로 요구하지 않는다).
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
