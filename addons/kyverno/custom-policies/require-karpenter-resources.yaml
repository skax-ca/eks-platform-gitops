# 이 저장소가 직접 소유하는 ValidatingPolicy. 업스트림 PSS 정책과 별도 Application 인 이유는
# applicationsets/baseline/kyverno-custom-policies.yaml 헤더가 갖는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-karpenter-resources
  annotations:
    policies.kyverno.io/title: Require CPU/Memory Requests and Memory Limit
    policies.kyverno.io/category: Platform
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Karpenter는 파드의 spec.containers[*].resources.requests를 기준으로 바인패킹·
      노드 크기·스케일링을 계산한다. requests가 없으면 그 계산이 틀어지고,
      memory limit이 없으면 파드 하나가 노드 메모리를 무제한으로 잠식해 다른 파드를
      OOM으로 몰아낼 수 있다. 그래서 requests(cpu·memory)와 memory limit을 필수로
      요구한다.
      ⚠️ cpu limit은 의도적으로 요구하지 않는다 — CPU는 압축 가능한 자원이라 limit을
      걸면 스로틀링으로 지연시간이 튄다. 이는 업스트림 Kyverno best-practice
      정책(require-requests-limits, kyverno.io/policies/best-practices)과 AWS EKS
      Best Practices Guide가 공통으로 권고하는 방향이다.
spec:
  # ⚠️ Deny 다 — Audit 으로 먼저 관찰하지 않고 바로 차단한다. 쓸 수 있는 값은 Deny·Audit·Warn
  #    셋뿐이라 Enforce 라고 적으면 apiserver 가 거부한다.
  #    failurePolicy 는 적지 않는다. 기본값 Fail 이 Deny 와 짝이 맞는 조합이다 — 위반을 막기로
  #    해 놓고 웹훅에 닿지 못할 때만 통과시키면 그 경로로 전부 새어 나간다(업스트림 PSS 정책이
  #    Audit + Ignore 로 짝을 맞춘 것과 같은 원칙, 반대 방향).
  validationActions:
    - Deny

  matchConstraints:
    # 업스트림 PSS 정책과 같은 모양이다 — pods 만 걸고 autogen 은 적지 않는다. 파드 컨트롤러
    #    (Deployment·Job 등) 대응 규칙은 Kyverno 가 서버에서 생성한다.
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # ArgoCD 자기 자신은 제외한다. argo-cd 차트가 모든 컴포넌트를 resources: {} 로 두고
    #    bootstrap/argocd-values.yaml 도 그 값을 채우지 않아서, 빼지 않으면 ArgoCD 자신의
    #    재배포가 이 정책에 막힌다 — Kyverno 장애가 ArgoCD 를 막고 고칠 수단을 잃는 순환이다.
    #    kube-system·kyverno·kube-public·kube-node-lease 는 Kyverno 기본 resourceFilters 가
    #    모든 정책에서 제외하므로 여기 적지 않는다.
    # 🔑 네임스페이스 제외를 excludeResourceRules 가 아니라 selector 로 거는 이유: 그 필드는
    #    apiGroup·resource 단위라 네임스페이스를 받지 않는다. kubernetes.io/metadata.name 은
    #    apiserver 가 모든 네임스페이스에 자기 이름으로 붙이는 라벨이라 이름으로 거르는 것과 같다.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - argocd

  # 세 식은 AND 다 — 하나라도 false 면 파드가 거부된다.
  # ⚠️ initContainers·ephemeralContainers 를 has() 로 먼저 거르는 것이 선택이 아니다. 그 필드가
  #    없는 파드에서 곧바로 .all() 을 부르면 CEL 이 런타임 에러를 내고, failurePolicy 기본값 Fail 이
  #    그 에러를 거부로 바꾼다 — initContainer 를 쓰지 않는 파드가 전부 막힌다.
  #    requests·limits 는 map 이라 필드가 있는지는 has(), 키가 있는지는 in 으로 본다.
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources)
          && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: >-
        Karpenter가 올바르게 스케줄링하려면 모든 컨테이너에 CPU/메모리 requests와
        메모리 limit이 필요하다(cpu limit은 의도적으로 요구하지 않는다).
    - expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c,
          has(c.resources)
          && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: >-
        initContainers에도 CPU/메모리 requests와 메모리 limit이 필요하다.
    - expression: >-
        !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          has(c.resources)
          && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: >-
        ephemeralContainers에도 CPU/메모리 requests와 메모리 limit이 필요하다.
