# +argocd:skip-file-rendering
#   ⚠️ 이 마커는 root-app(directory 소스)이 이 파일을 매니페스트로 읽지 않게 한다.
#      root-app 의 exclude 로 하지 않는 이유는 README의 "root App 스캔에서 파일을 빼는 방법" 절 참조.
apiVersion: v2
name: kyverno-custom-policies
description: |
  이 저장소가 직접 소유하는 Kyverno ClusterPolicy 모음 — 계층 2(플랫폼 GitOps)가 소유.

  ⚠️ 이것이 helm 차트인 이유는 값을 추상화하고 싶어서가 아니다(지금은 클러스터마다 값이
     갈리지 않는다). Chart.yaml이 있어야 kyverno-custom-policies Application이 Directory
     타입이 아니라 Helm 타입으로 인식되고, 그래야 templates/ 안의 skip-file-rendering 마커가
     "root-app만 제외"라는 원래 뜻대로 동작한다 — Chart.yaml이 없으면 이 Application 자신도
     Directory 타입으로 잡혀 자기 담당 파일을 스스로 걸러버린다(실제 발생 확인).

  클러스터별 값이 필요해지면 그때 values.yaml과 helm.parameters를 연다
  (addons/karpenter/nodepool/과 같은 패턴).
type: application
version: 0.1.0
