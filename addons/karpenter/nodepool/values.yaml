# ⚠️ 아래 둘은 **기본값이 없다.** ApplicationSet 이 cluster generator 에서 주입한다
#    (applicationsets/baseline/karpenter.yaml ②). 비어 있으면 템플릿이 required 로 실패한다 —
#    조용히 틀린 값이 들어가는 것보다 낫다.
clusterName: ""
nodeRole: ""

# ── 노드 형태 ────────────────────────────────────────────────────────────────
#
# ⚠️ arm64 다. 이 클러스터의 managed NG 가 Graviton(AL2023_ARM_64_STANDARD)이라, amd64 로 바꿔
#    베끼면 멀티아키 이미지가 없는 워크로드가 죽는다. Graviton 을 쓰지 않는 소비 루트에서만 바꾼다.
architectures:
  - arm64

# spot 우선, 없으면 on-demand. 중단은 Terraform 이 만든 SQS 를 컨트롤러가 소비해 graceful 처리한다.
capacityTypes:
  - spot
  - on-demand

# 범용 3종. ⚠️ `t` 계열은 일부러 뺐다 — 버스트 크레딧 모델이라 Karpenter 의 용량 계산과 어긋난다.
instanceCategories:
  - c
  - m
  - r
# 구세대 제외. arm64 에서는 6g/7g/8g 계열이 남는다.
instanceGenerationGt: "2"

# 폭주 방지 상한. ⚠️ 이 값에 닿으면 새 노드가 안 뜨고 파드가 Pending 으로 남는다 —
#    "왜 스케일이 안 되지"의 첫 확인 지점이다.
limits:
  cpu: "100"

disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 30s

# AL2023. `@latest` 는 Karpenter 가 최신 AMI 를 추적한다는 뜻이라 노드가 자동으로 갱신된다.
# ⚠️ EKS Best Practices Guide 는 운영 클러스터에 대해 `@latest` 를 쓰지 말고 검증한 AMI 로 핀하라고
#    강하게 권고한다(테스트되지 않은 AMI 가 그대로 배포돼 워크로드가 깨질 수 있다는 이유). 이 배포는
#    레퍼런스라 자동 추적의 값을 택했다 — 실제 운영 워크로드를 올리면 `al2023@v<날짜>` 로 핀한다.
amiAlias: al2023@latest
