# ⚠️ 아래 셋은 **기본값이 없다.** 부모 차트가 cluster Secret 값을 주입한다
#    (addons/cluster-addons/templates/karpenter-nodepool.yaml). 비어 있으면 템플릿이 required 로 실패한다 —
#    조용히 틀린 값이 들어가는 것보다 낫다.
clusterName: ""
nodeRole: ""
tier: ""

# ── 노드 형태 ────────────────────────────────────────────────────────────────
#
# ⚠️ arm64 다. 이 클러스터의 managed NG 가 Graviton(AL2023_ARM_64_STANDARD)이라, amd64 로 바꿔
#    베끼면 멀티아키 이미지가 없는 워크로드가 죽는다. Graviton 을 쓰지 않는 소비 루트에서만 바꾼다.
architectures:
  - arm64

# spot 우선, 없으면 on-demand. 중단은 Terraform 이 만든 SQS 를 컨트롤러가 소비해 graceful 처리한다.
capacityTypes:
  - spot
  - on-demand

# 범용 3종. ⚠️ `t` 계열은 일부러 뺐다 — 버스트 크레딧 모델이라 Karpenter 의 용량 계산과 어긋난다.
instanceCategories:
  - c
  - m
  - r
# 구세대 제외. arm64 에서는 6g/7g/8g 계열이 남는다.
instanceGenerationGt: "2"

# 폭주 방지 상한. ⚠️ 이 값에 닿으면 새 노드가 안 뜨고 파드가 Pending 으로 남는다 —
#    "왜 스케일이 안 되지"의 첫 확인 지점이다.
limits:
  cpu: "100"

disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 30s
  # 한 번에 자발적으로 비울 수 있는 노드의 비율. Karpenter 기본값과 같은 값을 명시로 둔다. budgets 를
  # 하나라도 적으면 기본 budget 이 사라지므로, 아래 drift 보류 줄만 두면 나머지 사유가 무제한이 된다.
  # 퍼센트는 올림이라 노드 10대 이하에서는 한 번에 1대다.
  budgetNodes: "10%"

# 티어별 drift 보류. true 인 티어의 NodePool 은 drift 로 판정된 노드를 교체하지 않는다(budget 0).
#
# EKS 마이너 업그레이드에 쓴다. 아래 amiAliasByTier 의 alias 는 컨트롤플레인 버전에 맞는 AMI 로
# 풀리므로, 컨트롤플레인이 올라가면 alias 를 고치지 않아도 Karpenter 가 기존 노드를 drift 로 보고
# 교체한다. app 워크로드가 이 노드에 있어, 컨트롤플레인과 system 노드그룹을 확인할 때까지 그 교체를
# 미룬다. 절차는 eks-reference-infra `docs/upgrade.md` 가 갖는다.
#
# ⚠️ 막는 것은 drift 사유의 교체뿐이다. 스케일 아웃이나 consolidation 으로 새로 뜨는 노드는 새
#    마이너로 뜬다.
# ⚠️ true 인 동안에는 amiAliasByTier 를 올려도 그 티어의 노드가 교체되지 않는다. AMI 승격도 drift 다.
# ⛔ true 인 채로 두지 않는다. 낡은 AMI 의 노드가 조용히 남는다. 두 줄이 false 인 것이 평소 상태다.
driftHoldByTier:
  prd: false
  nonprd: false

# AL2023 AMI. 값은 `<family>@<버전>` 이고 AL2023 의 버전은 날짜다 — `al2023@v20240703` 처럼 쓴다.
# `@latest` 는 Karpenter 가 최신을 추적한다는 뜻이라, 새 AMI 가 릴리스되면 낡은 노드를 전부 교체한다.
#
# Karpenter 문서는 `latest` 를 운영 환경에 권하지 않고 새 AMI 를 비운영에서 먼저 시험하라고 적는다.
# EKS Best Practices Guide 도 검증한 AMI 로 핀하라고 권고한다. 그래서 두 티어 모두 버전을 적고,
# 값은 티어로 갈린다 — nonprd 줄에 후보 버전을 먼저 올려 노드가 정상으로 뜨는 것을 보고, 같은 값을
# prd 줄에 올린다. 두 줄이 한 파일에 있어 그 사이가 git 이력에 승격 구간으로 남는다. 차트를 티어별로
# 쪼개지 않는 이유는 addons/cluster-addons/templates/karpenter-nodepool.yaml 헤더에 있다.
#
# prd 줄은 그 클러스터에서 **실제로 뜬 노드**에서 읽은 값만 받는다(`kubectl get nodeclaim -o wide`).
# 조회만 해서 넣은 최신 버전은 아무도 그 위에서 워크로드를 돌려보지 않았다는 점에서 `latest` 와
# 위험이 같고, 자동 추적의 이점만 잃는다. nonprd 줄은 그 검증을 받을 후보를 넣는 자리다.
#
# ⚠️ 값을 바꾸면 그 티어의 노드가 교체된다. Karpenter 가 낡은 노드를 걷어내고 새로 띄운다.
# ⚠️ 새 AMI 는 자동으로 들어오지 않는다. 릴리스를 확인해 nonprd 줄을 올리는 사람이 승격을 시작한다.
# 🔑 두 줄이 같으면 승격이 끝난 상태이고, 다르면 nonprd 가 후보를 시험하는 중이다.
amiAliasByTier:
  prd: al2023@v20260917
  nonprd: al2023@v20260917
