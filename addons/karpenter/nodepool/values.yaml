# ⚠️ 아래 셋은 **기본값이 없다.** 부모 차트가 cluster Secret 값을 주입한다
#    (addons/cluster-addons/templates/karpenter-nodepool.yaml). 비어 있으면 템플릿이 required 로 실패한다 —
#    조용히 틀린 값이 들어가는 것보다 낫다.
clusterName: ""
nodeRole: ""
tier: ""

# ── 노드 형태 ────────────────────────────────────────────────────────────────
#
# ⚠️ arm64 다. 이 클러스터의 managed NG 가 Graviton(AL2023_ARM_64_STANDARD)이라, amd64 로 바꿔
#    베끼면 멀티아키 이미지가 없는 워크로드가 죽는다. Graviton 을 쓰지 않는 소비 루트에서만 바꾼다.
architectures:
  - arm64

# spot 우선, 없으면 on-demand. 중단은 Terraform 이 만든 SQS 를 컨트롤러가 소비해 graceful 처리한다.
capacityTypes:
  - spot
  - on-demand

# 범용 3종. ⚠️ `t` 계열은 일부러 뺐다 — 버스트 크레딧 모델이라 Karpenter 의 용량 계산과 어긋난다.
instanceCategories:
  - c
  - m
  - r
# 구세대 제외. arm64 에서는 6g/7g/8g 계열이 남는다.
instanceGenerationGt: "2"

# 폭주 방지 상한. ⚠️ 이 값에 닿으면 새 노드가 안 뜨고 파드가 Pending 으로 남는다 —
#    "왜 스케일이 안 되지"의 첫 확인 지점이다.
limits:
  cpu: "100"

# 티어별 disruption. Karpenter 가 평소에 떠 있는 노드를 얼마나 건드리는지를 정한다.
#
# 🔑 이 맵은 승격 대상이 아니다. amiAliasByTier 와 부모 차트의 버전 표는 두 줄이 같은 것이 정상이고
#    다르면 승격이 진행 중이다. 이 맵은 두 줄이 다른 것이 정상이고 그 상태로 계속 간다. 운영과 비운영이
#    노드 교체를 받아들이는 정도가 달라서다.
#
# nonprd: 비용이 먼저다. 덜 쓰이는 노드를 30초 뒤부터 합치고 더 싼 구성으로 바꾼다.
# prd: 합치기는 유지하되 조용한 시간에만 한다.
#   · consolidateAfter 10m: 파드가 오르내릴 때마다 타이머가 다시 돈다. 짧으면 배포 직후의 일시적인
#     빈자리를 보고 노드를 합쳤다가 곧 다시 늘린다.
#   · 평일 업무 시간에는 Underutilized 를 막는다. 빈 노드 정리(Empty)와 drift 교체는 막지 않는다.
#     AMI 승격이 업무 시간에 걸리는 것을 막으려면 그 줄의 reasons 에 Drifted 를 더한다.
#   ⚠️ schedule 은 UTC 만 받는다. "0 0 * * mon-fri" + 10h 는 KST 평일 09~19시다. 시작을 KST 09시보다
#      앞으로 당기면 UTC 로는 전날이 되어 요일 식도 함께 바꿔야 한다.
# ⛔ prd 를 WhenEmpty 로 바꾸지 않는다. 파드가 하나라도 남은 노드는 합쳐지지 않아 워크로드가 줄어도
#    노드가 남는다. 업무 시간에 노드를 건드리지 않는 것은 위 schedule 이 이미 한다.
#
# budgets 의 첫 줄(10%)은 Karpenter 기본값과 같은 값을 명시로 둔 것이다. budgets 를 하나라도 적으면
# 기본 budget 이 사라지므로, 이 줄이 없으면 나머지 사유가 무제한이 된다. 퍼센트는 올림이라 노드 10대
# 이하에서는 한 번에 1대다. Karpenter 는 걸린 budget 중 가장 좁은 것을 따른다.
#
# ⚠️ 이 블록은 노드 템플릿이 아니다. 값을 바꿔도 떠 있는 노드가 교체되지 않고 이후의 판단에만 걸린다.
# ⚠️ 만료(expireAfter, Karpenter 기본 720h)는 budget 이 막지 못한다. 30일이 지난 노드는 시간과 무관하게
#    교체된다.
disruptionByTier:
  prd:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      - nodes: "10%"
      - nodes: "0"
        reasons:
          - Underutilized
        schedule: "0 0 * * mon-fri"
        duration: 10h
  nonprd:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"

# 티어별 업그레이드 보류. true 인 티어의 NodePool 은 떠 있는 노드를 스스로 갈아 끼우지 않는다. drift 로
# 판정된 노드의 교체와, 더 싼 구성을 찾아 노드를 바꾸거나 합치는 consolidation 을 함께 막는다(budget 0).
# 위 disruptionByTier 의 budgets 뒤에 한 줄로 더해진다.
#
# EKS 마이너 업그레이드에 쓴다. 아래 amiAliasByTier 의 alias 는 컨트롤플레인 버전에 맞는 AMI 로
# 풀리므로, 컨트롤플레인이 올라가면 alias 를 고치지 않아도 Karpenter 가 기존 노드를 drift 로 보고
# 교체한다. app 워크로드가 이 노드에 있어, 컨트롤플레인과 system 노드그룹을 확인할 때까지 그 교체를
# 미룬다. 절차는 eks-reference-infra `docs/upgrade.md` 가 갖는다.
#
# consolidation 까지 막는 이유: 보류 중에 노드가 바뀌면 그 노드는 새 마이너로 뜬다. 되돌리려면 노드가
# 컨트롤플레인보다 높을 수 없어, 그렇게 바뀐 노드를 전부 다시 비워야 한다.
#
# ⚠️ 빈 노드를 치우는 것(Empty)은 막지 않는다. 파드가 없는 노드라 워크로드가 움직이지 않는다.
# ⚠️ 스케일 아웃으로 새로 뜨는 노드는 막을 수 없고 새 마이너로 뜬다.
# ⚠️ true 인 동안에는 amiAliasByTier 를 올려도 그 티어의 노드가 교체되지 않는다. AMI 승격도 drift 다.
# ⛔ true 인 채로 두지 않는다. 낡은 AMI 의 노드가 조용히 남고 노드가 합쳐지지 않아 비용이 쌓인다. 두
#    줄이 false 인 것이 평소 상태다.
upgradeHoldByTier:
  prd: false
  nonprd: true

# AL2023 AMI. 값은 `<family>@<버전>` 이고 AL2023 의 버전은 날짜다 — `al2023@v20240703` 처럼 쓴다.
# `@latest` 는 Karpenter 가 최신을 추적한다는 뜻이라, 새 AMI 가 릴리스되면 낡은 노드를 전부 교체한다.
#
# Karpenter 문서는 `latest` 를 운영 환경에 권하지 않고 새 AMI 를 비운영에서 먼저 시험하라고 적는다.
# EKS Best Practices Guide 도 검증한 AMI 로 핀하라고 권고한다. 그래서 두 티어 모두 버전을 적고,
# 값은 티어로 갈린다 — nonprd 줄에 후보 버전을 먼저 올려 노드가 정상으로 뜨는 것을 보고, 같은 값을
# prd 줄에 올린다. 두 줄이 한 파일에 있어 그 사이가 git 이력에 승격 구간으로 남는다. 차트를 티어별로
# 쪼개지 않는 이유는 addons/cluster-addons/templates/karpenter-nodepool.yaml 헤더에 있다.
#
# prd 줄은 그 클러스터에서 **실제로 뜬 노드**에서 읽은 값만 받는다(`kubectl get nodeclaim -o wide`).
# 조회만 해서 넣은 최신 버전은 아무도 그 위에서 워크로드를 돌려보지 않았다는 점에서 `latest` 와
# 위험이 같고, 자동 추적의 이점만 잃는다. nonprd 줄은 그 검증을 받을 후보를 넣는 자리다.
#
# ⚠️ 값을 바꾸면 그 티어의 노드가 교체된다. Karpenter 가 낡은 노드를 걷어내고 새로 띄운다.
# ⚠️ 새 AMI 는 자동으로 들어오지 않는다. 릴리스를 확인해 nonprd 줄을 올리는 사람이 승격을 시작한다.
# 🔑 두 줄이 같으면 승격이 끝난 상태이고, 다르면 nonprd 가 후보를 시험하는 중이다.
amiAliasByTier:
  prd: al2023@v20260917
  nonprd: al2023@v20260917
