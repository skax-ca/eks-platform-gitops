# ⚠️ 아래 셋은 **기본값이 없다.** ApplicationSet 이 cluster generator 에서 주입한다
#    (applicationsets/baseline/karpenter.yaml ②). 비어 있으면 템플릿이 required 로 실패한다 —
#    조용히 틀린 값이 들어가는 것보다 낫다.
clusterName: ""
nodeRole: ""
tier: ""

# ── 노드 형태 ────────────────────────────────────────────────────────────────
#
# ⚠️ arm64 다. 이 클러스터의 managed NG 가 Graviton(AL2023_ARM_64_STANDARD)이라, amd64 로 바꿔
#    베끼면 멀티아키 이미지가 없는 워크로드가 죽는다. Graviton 을 쓰지 않는 소비 루트에서만 바꾼다.
architectures:
  - arm64

# spot 우선, 없으면 on-demand. 중단은 Terraform 이 만든 SQS 를 컨트롤러가 소비해 graceful 처리한다.
capacityTypes:
  - spot
  - on-demand

# 범용 3종. ⚠️ `t` 계열은 일부러 뺐다 — 버스트 크레딧 모델이라 Karpenter 의 용량 계산과 어긋난다.
instanceCategories:
  - c
  - m
  - r
# 구세대 제외. arm64 에서는 6g/7g/8g 계열이 남는다.
instanceGenerationGt: "2"

# 폭주 방지 상한. ⚠️ 이 값에 닿으면 새 노드가 안 뜨고 파드가 Pending 으로 남는다 —
#    "왜 스케일이 안 되지"의 첫 확인 지점이다.
limits:
  cpu: "100"

disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 30s

# AL2023 AMI. 값은 `<family>@<버전>` 이고 AL2023 의 버전은 날짜다 — `al2023@v20240703` 처럼 쓴다.
# `@latest` 는 Karpenter 가 최신을 추적한다는 뜻이라, 새 AMI 가 릴리스되면 낡은 노드를 전부 교체한다.
#
# Karpenter 문서는 `latest` 를 운영 환경에 권하지 않고 새 AMI 를 비운영에서 먼저 시험하라고 적는다.
# EKS Best Practices Guide 도 검증한 AMI 로 핀하라고 권고한다. 그래서 이 값은 티어로 갈린다 —
# nonprd 를 먼저 올려 노드가 정상으로 뜨는 것을 보고, 같은 값을 prd 에 올린다. 두 줄이 한 파일에
# 있어 그 사이가 git 이력에 승격 구간으로 남는다. 차트를 티어별로 쪼개지 않는 이유는
# applicationsets/baseline/karpenter-nodepool.yaml 헤더에 있다.
#
# 핀 값은 그 클러스터에서 **실제로 뜬 노드**에서 읽는다(`kubectl get nodeclaim -o wide`). 조회만 해서
# 넣은 최신 버전은 아무도 그 위에서 워크로드를 돌려보지 않았다는 점에서 `latest` 와 위험이 같고,
# 자동 추적의 이점만 잃는다.
#
# ⚠️ 값을 바꾸면 그 티어의 노드가 교체된다. Karpenter 가 낡은 노드를 걷어내고 새로 띄운다.
# 🔑 지금 둘 다 `latest` 인 것은 핀할 값이 없기 때문이다. 클러스터가 철거돼 있어 "검증한 AMI" 가
#    존재하지 않는다. 재구축해 노드가 뜨면 그 버전을 prd 에 핀하고, nonprd 는 다음 AMI 를 먼저
#    받는 자리로 둔다.
amiAliasByTier:
  prd: al2023@latest
  nonprd: al2023@latest
