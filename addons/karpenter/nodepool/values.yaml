# ⚠️ 아래 둘은 **기본값이 없다.** ApplicationSet 이 cluster generator 에서 주입한다
#    (addons/baseline/karpenter.yaml ②). 비어 있으면 템플릿이 required 로 실패한다 —
#    조용히 틀린 값이 들어가는 것보다 낫다.
clusterName: ""
nodeRole: ""

# ── 노드 형태 ────────────────────────────────────────────────────────────────
#
# 🔴 **arm64 다.** 이 클러스터의 managed NG 는 AL2023_ARM_64_STANDARD · t4g.medium 이다(실측 2026-08-10).
#    ⚠️ 30 §2.2 의 NodePool 스펙은 `amd64` 로 적혀 있는데 그건 **PoC 의 x86 클러스터** 기준이다.
#    그대로 베끼면 arm64 클러스터에 amd64 노드가 섞여 멀티아키 이미지가 없는 워크로드가 죽는다.
#    ⇒ 소비 루트가 Graviton 을 쓰지 않는 고객사에서는 이 값을 amd64 로 바꾼다.
architectures:
  - arm64

# spot 우선, 없으면 on-demand. 중단은 Terraform 이 만든 SQS 를 컨트롤러가 소비해 graceful 처리한다.
capacityTypes:
  - spot
  - on-demand

# 범용 3종. ⚠️ `t` 계열은 일부러 뺐다 — 버스트 크레딧 모델이라 Karpenter 의 용량 계산과 어긋난다.
instanceCategories:
  - c
  - m
  - r
# 구세대 제외. arm64 에서는 6g/7g/8g 계열이 남는다.
instanceGenerationGt: "2"

# 폭주 방지 상한. ⚠️ 이 값에 닿으면 새 노드가 안 뜨고 파드가 Pending 으로 남는다 —
#    "왜 스케일이 안 되지"의 첫 확인 지점이다.
limits:
  cpu: "100"

disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 30s

# AL2023. `@latest` 는 Karpenter 가 최신 AMI 를 추적한다는 뜻이라 노드가 자동으로 갱신된다.
# ⚠️ 재현 가능한 빌드가 필요해지면 특정 AMI ID/버전으로 핀한다(그때 노드 교체가 계획적으로 일어난다).
amiAlias: al2023@latest
