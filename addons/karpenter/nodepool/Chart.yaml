apiVersion: v2
name: karpenter-nodepool
description: |
  Karpenter NodePool / EC2NodeClass — 계층 2가 소유하는 인프라 CR.

  ⚠️ 평문이 아니라 helm 차트인 이유는 per-cluster 값(clusterName·nodeRole)을 CR 에 주입할 다른
     수단이 없어서다. ApplicationSet 의 fasttemplate 은 Application spec 에만 적용되고 git 경로
     안의 파일에는 적용되지 않는다.

  NodePool 종류를 리스트화하는 확장은 2종째가 실제로 필요할 때 연다.
type: application
version: 0.1.0
