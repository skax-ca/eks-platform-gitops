{{- $tier := required "tier 가 비어 있다 — cluster Secret 의 tier 라벨에서 온다" .Values.tier -}}
{{- /* false 도 유효한 값이라 required 로 읽지 않는다. 키가 없는 것만 실패시킨다. */ -}}
{{- if not (hasKey .Values.driftHoldByTier $tier) -}}
{{- fail (printf "driftHoldByTier 에 tier %q 항목이 없다 — values.yaml 에 그 티어를 추가한다" $tier) -}}
{{- end -}}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  annotations:
    kubernetes.io/description: >-
      플랫폼 baseline NodePool. 시스템·컨트롤러는 managed NG 에 두고 앱·버스트만 여기서 받는다.
      Karpenter 컨트롤러 자신은 chart affinity 가 karpenter.sh/nodepool DoesNotExist 라 이 풀을
      자연히 회피한다.
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: {{ toYaml .Values.architectures | nindent 12 }}
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toYaml (required (printf "capacityTypesByTier 에 tier %q 항목이 없다 — values.yaml 에 그 티어를 추가한다" .Values.tier) (index .Values.capacityTypesByTier .Values.tier)) | nindent 12 }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toYaml .Values.instanceCategories | nindent 12 }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: [{{ .Values.instanceGenerationGt | quote }}]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: {{ .Values.limits.cpu | quote }}
  disruption:
    consolidationPolicy: {{ .Values.disruption.consolidationPolicy }}
    consolidateAfter: {{ .Values.disruption.consolidateAfter }}
    # 여러 budget 이 걸리면 Karpenter 는 가장 좁은 것을 따른다. 첫 줄은 모든 사유에 걸리고, 보류 줄은
    # drift 에만 0 을 건다.
    budgets:
      - nodes: {{ .Values.disruption.budgetNodes | quote }}
      {{- if index .Values.driftHoldByTier $tier }}
      - nodes: "0"
        reasons:
          - Drifted
      {{- end }}
